        async function confirmSendMedia() {
            if (!pendingMediaBlob || !dataChannel || dataChannel.readyState !== 'open') return;
            
            const sendBtn = document.getElementById('confirm-media-btn');
            sendBtn.textContent = 'در حال ارسال...';
            sendBtn.disabled = true;

            // پنجره پیش‌نمایش فوراً بسته می‌شود تا هنگام ارسال بتوان تایپ کرد
            const blob = pendingMediaBlob, type = pendingMediaType, name = pendingMediaName;
            cancelSendMedia();
            await sendBlobOverChannel(blob, type, name);
        }

        async function sendBlobOverChannel(blob, mediaType, fileName, onDone) {
            if (!blob || !dataChannel || dataChannel.readyState !== 'open') return;
            const msgId = generateUniqueId();
            const blobUrl = URL.createObjectURL(blob);
            const bubble = displayBlobInChat(blobUrl, mediaType, 'sent', msgId, fileName, blob.size);
            const prog = document.createElement('span');
            prog.className = 'send-progress';
            prog.textContent = '⏳ در حال ارسال ۰٪';
            const wrap = bubble.querySelector('.media-container') || bubble;
            wrap.appendChild(prog);
            const faNum = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
            
            const arrayBuffer = await blob.arrayBuffer();
            const mimeType = blob.type || (mediaType === 'file' ? 'application/octet-stream' : 'video/mp4');

            dataChannel.send(JSON.stringify({ 
                type: 'file-start', 
                id: msgId, 
                mime: mimeType, 
                name: fileName || '',
                size: arrayBuffer.byteLength 
            }));

            const CHUNK_SIZE = 16384; 
            const idBytes = new TextEncoder().encode(msgId);
            const idLen = idBytes.length;

            let offset = 0;
            const ch = dataChannel;
            function sendChunks() {
                if (ch.readyState !== 'open') { prog.textContent = '⚠️ ارسال ناتمام ماند (قطع ارتباط)'; return; }
                prog.textContent = '⏳ در حال ارسال ' + faNum(Math.floor(offset * 100 / Math.max(1, arrayBuffer.byteLength))) + '٪';
                while (offset < arrayBuffer.byteLength) {
                    if (ch.bufferedAmount > 256 * 1024) {
                        setTimeout(sendChunks, 25);
                        return;
                    }
                    const end = Math.min(offset + CHUNK_SIZE, arrayBuffer.byteLength);
                    const chunkData = arrayBuffer.slice(offset, end);
                    
                    const packet = new Uint8Array(1 + idLen + chunkData.byteLength);
                    packet[0] = idLen;
                    packet.set(idBytes, 1);
                    packet.set(new Uint8Array(chunkData), 1 + idLen);

                    try { ch.send(packet.buffer); } catch (e) { prog.textContent = '⚠️ ارسال ناتمام ماند'; return; }
                    offset = end;
                }

                ch.send(JSON.stringify({ type: 'file-end', id: msgId }));
                prog.textContent = '✓ ارسال شد';
                setTimeout(() => prog.remove(), 2500);
                if (onDone) onDone();
            }

            sendChunks();
        }

        // ===== ضبط و ارسال صدا =====
        let voiceRecorder = null, voiceStream = null, voiceChunks = [], voiceTimer = null, voiceSec = 0, voiceCancelled = false;
        const VOICE_MAX_SEC = 300;

        async function toggleVoiceRecording() {
            if (voiceRecorder && voiceRecorder.state === 'recording') { stopVoiceRecording(false); return; }
            if (!dataChannel || dataChannel.readyState !== 'open') { alert('ابتدا باید به طرف مقابل وصل باشید.'); return; }
            try {
                voiceStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
            } catch (err) {
                alert('دسترسی به میکروفون امکان‌پذیر نشد: ' + err.message);
                return;
            }
            let mime = '';
            ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/webm'].some(m => {
                if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mime = m; return true; }
                return false;
            });
            const opts = mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 };
            try { voiceRecorder = new MediaRecorder(voiceStream, opts); }
            catch (e) { voiceRecorder = new MediaRecorder(voiceStream); }
            voiceChunks = [];
            voiceCancelled = false;
            voiceRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) voiceChunks.push(e.data); };
            voiceRecorder.onstop = () => {
                const type = (voiceRecorder.mimeType || mime || 'audio/webm').split(';')[0];
                const blob = new Blob(voiceChunks, { type });
                releaseVoiceStream();
                if (!voiceCancelled && blob.size > 0 && voiceSec >= 1) {
                    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
                    sendBlobOverChannel(blob, 'audio', 'voice-' + Date.now() + '.' + ext);
                }
            };
            voiceRecorder.start(500);
            voiceSec = 0;
            updateVoiceTime();
            document.getElementById('voice-btn').classList.add('recording');
            document.getElementById('voice-btn').textContent = '⏹';
            document.getElementById('voice-rec-bar').style.display = 'flex';
            sendActivity('voice');
            document.getElementById('sticker-panel').style.display = 'none';
            voiceTimer = setInterval(() => {
                voiceSec++;
                updateVoiceTime();
                if (voiceSec >= VOICE_MAX_SEC) stopVoiceRecording(false);
            }, 1000);
        }

        function updateVoiceTime() {
            const m = Math.floor(voiceSec / 60), s = voiceSec % 60;
            document.getElementById('voice-rec-time').textContent = m + ':' + String(s).padStart(2, '0');
        }

        function stopVoiceRecording(cancel) {
            voiceCancelled = !!cancel;
            clearInterval(voiceTimer);
            if (voiceRecorder && voiceRecorder.state === 'recording') voiceRecorder.stop();
            else releaseVoiceStream();
            const btn = document.getElementById('voice-btn');
            if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; }
            const bar = document.getElementById('voice-rec-bar');
            if (bar) bar.style.display = 'none';
            sendActivity('');
        }

        function cancelVoiceRecording() { stopVoiceRecording(true); }

        function releaseVoiceStream() {
            if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null; }
        }

        function showWipeModal() {
            document.getElementById('wipe-modal').style.display = 'flex';
        }

        function hideWipeModal() {
            document.getElementById('wipe-modal').style.display = 'none';
        }

        function executeWipeChoice(mode) {
            hideWipeModal();
            if (mode === 'everyone') {
                if (dataChannel && dataChannel.readyState === 'open') {
                    try {
                        dataChannel.send(JSON.stringify({ type: 'control', command: 'disconnect' }));
                    } catch(e) {}
                }
                setTimeout(() => {
                    executeSilentWipe();
                }, 100);
            } else if (mode === 'me') {
                if (dataChannel && dataChannel.readyState === 'open') {
                    try { dataChannel.send(JSON.stringify({ type: 'control', command: 'left' })); } catch(e) {}
                }
                setTimeout(() => { executeSilentWipe(); }, 100);
            }
        }

        function executeSilentWipe() {
            stopReconnect();
            room = null; roomSecret = null; signalKey = null;
            try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
            cleanupCall();
            closeInAppRecordModal();
            try { stopVoiceRecording(true); } catch(e) {}
            if (dataChannel) {
                dataChannel.onclose = null;
                dataChannel.close();
            }
            if (peerConnection) {
                peerConnection.close();
            }
            document.body.innerHTML = '';
            document.body.style.backgroundColor = '#ffffff';
        }

        let remoteCallStream = null;

        async function startCall(videoCall = false) {
            if (!dataChannel || dataChannel.readyState !== 'open') { alert('ابتدا باید به مخاطب وصل باشید.'); return; }
            if (callConnection) return;
            pendingCallCandidates = [];
            isCurrentCallVideo = videoCall;
            try {
                const constraints = {
                    audio: true,
                    video: videoCall ? { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (videoCall) {
                    document.getElementById('local-video').srcObject = localStream;
                    document.getElementById('video-call-modal').style.display = 'flex';
                } else {
                    showCallModal("در حال تماس صوتی...", "active");
                }

                remoteCallStream = null;
                callConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => callConnection.addTrack(track, localStream));

                callConnection.onicecandidate = e => {
                    if (e.candidate && dataChannel && dataChannel.readyState === 'open') {
                        dataChannel.send(JSON.stringify({ type: 'call-candidate', candidate: e.candidate }));
                    }
                };

                callConnection.ontrack = attachRemoteTrack;
                watchCallState(callConnection);

                const offer = await callConnection.createOffer();
                await callConnection.setLocalDescription(offer);
                dataChannel.send(JSON.stringify({ type: 'call-offer', sdp: offer, isVideo: videoCall }));
            } catch (err) {
                alert("خطا در دسترسی به دوربین یا میکروفون: " + err.message);
                cleanupCall();
                hideCallModal();
            }
        }

        let pendingCallCandidates = [];

        function attachRemoteTrack(e) {
            if (!remoteCallStream) remoteCallStream = new MediaStream();
            const stream = (e.streams && e.streams[0]) ? e.streams[0] : remoteCallStream;
            if (stream === remoteCallStream && !remoteCallStream.getTracks().includes(e.track)) remoteCallStream.addTrack(e.track);
            const el = document.getElementById(isCurrentCallVideo ? 'remote-video' : 'remote-audio');
            if (el.srcObject !== stream) el.srcObject = stream;
            el.muted = false;
            const p = el.play();
            if (p && p.catch) p.catch(() => {
                document.getElementById('tap-to-play').style.display = isCurrentCallVideo ? 'block' : 'none';
                if (!isCurrentCallVideo) showCallModal('در حال مکالمه — برای شنیدن صدا صفحه را لمس کنید', 'active');
                document.addEventListener('click', resumeRemoteMedia, { once: true });
            });
        }

        function resumeRemoteMedia() {
            document.getElementById('tap-to-play').style.display = 'none';
            ['remote-video', 'remote-audio'].forEach(id => {
                const el = document.getElementById(id);
                if (el.srcObject) { const p = el.play(); if (p && p.catch) p.catch(() => {}); }
            });
        }

        function watchCallState(pc) {
            pc.onconnectionstatechange = () => {
                if (pc !== callConnection) return;
                const st = pc.connectionState;
                if (!isCurrentCallVideo) {
                    if (st === 'connecting') showCallModal('در حال برقراری مسیر صدا...', 'active');
                    else if (st === 'connected') showCallModal('در حال مکالمه', 'active');
                    else if (st === 'failed') showCallModal('مسیر صدا برقرار نشد. تماس را قطع و دوباره امتحان کنید.', 'active');
                }
                if (st === 'failed') { try { pc.restartIce(); } catch (e) {} }
            };
        }

        async function flushCallCandidates() {
            if (!callConnection || !callConnection.remoteDescription) return;
            const list = pendingCallCandidates; pendingCallCandidates = [];
            for (const c of list) { try { await callConnection.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
        }

        function handleCallOffer(offer, isVideo) {
            pendingCallCandidates = [];
            pendingCallOffer = offer;
            isCurrentCallVideo = isVideo;
            showCallModal(isVideo ? "تماس تصویری ورودی..." : "تماس صوتی ورودی...", "incoming");
        }

        async function acceptCall() {
            try {
                const constraints = {
                    audio: true,
                    video: isCurrentCallVideo ? { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                hideCallModal();

                if (isCurrentCallVideo) {
                    document.getElementById('local-video').srcObject = localStream;
                    document.getElementById('video-call-modal').style.display = 'flex';
                } else {
                    showCallModal("در حال مکالمه", "active");
                }

                remoteCallStream = null;
                callConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => callConnection.addTrack(track, localStream));

                callConnection.onicecandidate = e => {
                    if (e.candidate && dataChannel && dataChannel.readyState === 'open') {
                        dataChannel.send(JSON.stringify({ type: 'call-candidate', candidate: e.candidate }));
                    }
                };

                callConnection.ontrack = attachRemoteTrack;
                watchCallState(callConnection);

                await callConnection.setRemoteDescription(new RTCSessionDescription(pendingCallOffer));
                await flushCallCandidates();
                const answer = await callConnection.createAnswer();
                await callConnection.setLocalDescription(answer);

                dataChannel.send(JSON.stringify({ type: 'call-answer', sdp: answer }));
                pendingCallOffer = null;
            } catch (err) {
                alert("خطا در دسترسی به دوربین/میکروفون.");
                rejectCall();
            }
        }

        function rejectCall() {
            if (dataChannel && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify({ type: 'call-reject' }));
            hideCallModal();
            pendingCallOffer = null;
            pendingCallCandidates = [];
        }

        function handleCallReject() {
            alert("تماس رد شد.");
            cleanupCall();
            hideCallModal();
        }

        async function handleCallAnswer(answer) {
            if (callConnection) {
                await callConnection.setRemoteDescription(new RTCSessionDescription(answer));
                await flushCallCandidates();
                if (!isCurrentCallVideo) {
                    showCallModal("در حال برقراری مسیر صدا...", "active");
                }
            }
        }

        // کاندیدهایی که قبل از پاسخ دادن می‌رسند نگه داشته می‌شوند (قبلاً دور ریخته می‌شدند و صدا/تصویر نمی‌آمد)
        function handleCallCandidate(candidate) {
            if (!candidate) return;
            if (callConnection && callConnection.remoteDescription) {
                callConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
            } else {
                pendingCallCandidates.push(candidate);
            }
        }

        function endCall() {
            if (dataChannel && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify({ type: 'call-end' }));
            cleanupCall();
            hideCallModal();
        }

        function handleCallEnd() {
            cleanupCall();
            hideCallModal();
        }

        // ---------- ضبط تماس (روی خود گوشی؛ از حجم Metered استفاده نمی‌کند) ----------
        let callRecorder = null, callRecChunks = [], callRecCtx = null, callRecDraw = null, callRecStart = 0;

        function setCallRecButtons(on) {
            ['call-rec-btn-audio', 'call-rec-btn-video'].forEach(id => {
                const b = document.getElementById(id);
                if (!b) return;
                b.classList.toggle('call-rec-on', on);
                if (id === 'call-rec-btn-audio') b.textContent = on ? '⏹ پایان ضبط' : '⏺ ضبط تماس';
            });
        }

        function toggleCallRecording() {
            if (callRecorder && callRecorder.state === 'recording') { stopCallRecording(); return; }
            startCallRecording();
        }

        function startCallRecording() {
            if (!callConnection || !localStream) return alert('تماسی در جریان نیست.');
            try {
                callRecCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = callRecCtx.createMediaStreamDestination();
                const addAudio = s => { if (s && s.getAudioTracks().length) callRecCtx.createMediaStreamSource(new MediaStream(s.getAudioTracks())).connect(dest); };
                addAudio(localStream);
                const remoteEl = document.getElementById(isCurrentCallVideo ? 'remote-video' : 'remote-audio');
                addAudio(remoteEl.srcObject);
                const tracks = [...dest.stream.getAudioTracks()];
                let options;
                if (isCurrentCallVideo) {
                    // تصویر مخاطب بزرگ + تصویر خودم کوچک، با کیفیت پایین برای حجم کم
                    const canvas = document.createElement('canvas');
                    canvas.width = 360; canvas.height = 480;
                    const g = canvas.getContext('2d');
                    const rv = document.getElementById('remote-video'), lv = document.getElementById('local-video');
                    const draw = () => {
                        g.fillStyle = '#000'; g.fillRect(0, 0, 360, 480);
                        try { if (rv.videoWidth) g.drawImage(rv, 0, 0, 360, 480); } catch (e) {}
                        try { if (lv.videoWidth) g.drawImage(lv, 250, 10, 100, 133); } catch (e) {}
                    };
                    callRecDraw = setInterval(draw, 1000 / 12);
                    tracks.unshift(canvas.captureStream(12).getVideoTracks()[0]);
                    const vm = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m));
                    options = Object.assign(vm ? { mimeType: vm } : {}, { videoBitsPerSecond: 220000, audioBitsPerSecond: 24000 });
                } else {
                    const am = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m));
                    options = Object.assign(am ? { mimeType: am } : {}, { audioBitsPerSecond: 24000 });
                }
                const mixed = new MediaStream(tracks);
                try { callRecorder = new MediaRecorder(mixed, options); } catch (e) { callRecorder = new MediaRecorder(mixed); }
                callRecChunks = [];
                callRecorder.ondataavailable = e => { if (e.data && e.data.size) callRecChunks.push(e.data); };
                callRecorder.onstop = () => {
                    const type = callRecorder.mimeType || (isCurrentCallVideo ? 'video/webm' : 'audio/webm');
                    const blob = new Blob(callRecChunks, { type });
                    const ext = type.includes('mp4') ? (isCurrentCallVideo ? 'mp4' : 'm4a') : type.includes('ogg') ? 'ogg' : 'webm';
                    const d = new Date(callRecStart);
                    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
                    if (blob.size) downloadBlob(URL.createObjectURL(blob), (isCurrentCallVideo ? 'video-call-' : 'voice-call-') + stamp + '.' + ext);
                    callRecChunks = []; callRecorder = null;
                    if (callRecDraw) { clearInterval(callRecDraw); callRecDraw = null; }
                    if (callRecCtx) { try { callRecCtx.close(); } catch (e) {} callRecCtx = null; }
                    setCallRecButtons(false);
                };
                callRecStart = Date.now();
                callRecorder.start(1000);
                setCallRecButtons(true);
            } catch (e) {
                alert('ضبط تماس روی این مرورگر ممکن نشد: ' + e.message);
                setCallRecButtons(false);
            }
        }

        function stopCallRecording() {
            if (callRecorder && callRecorder.state === 'recording') {
                callRecorder.stop();
            }
        }

        function cleanupCall() {
            stopCallRecording();
            if (callConnection) { callConnection.close(); callConnection = null; }
            pendingCallCandidates = []; remoteCallStream = null;
            const ttp = document.getElementById('tap-to-play'); if (ttp) ttp.style.display = 'none';
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            document.getElementById('remote-audio').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('local-video').srcObject = null;
            document.getElementById('video-call-modal').style.display = 'none';
        }

        async function switchCamera() {
            if (!localStream || !isCurrentCallVideo) return;
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) videoTrack.stop();

            try {
                const newStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }
                });
                const newVideoTrack = newStream.getVideoTracks()[0];
                localStream.removeTrack(videoTrack);
                localStream.addTrack(newVideoTrack);

                const sender = callConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(newVideoTrack);

                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('local-video').style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "none";
            } catch (e) {
                console.error("خطا در جابجایی دوربین", e);
            }
        }

        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('mute-mic-btn').style.backgroundColor = audioTrack.enabled ? "#6c757d" : "#d9534f";
                document.getElementById('mute-mic-btn').textContent = audioTrack.enabled ? "🎙" : "🔇";
            }
        }

        function showCallModal(text, state) {
            document.getElementById('call-modal').style.display = 'flex';
            document.getElementById('call-status-text').textContent = text;
            if (state === 'incoming') {
                document.getElementById('call-incoming-btns').style.display = 'flex';
                document.getElementById('call-active-btns').style.display = 'none';
            } else if (state === 'active') {
                document.getElementById('call-incoming-btns').style.display = 'none';
                document.getElementById('call-active-btns').style.display = 'flex';
            }
        }

        function hideCallModal() { document.getElementById('call-modal').style.display = 'none'; }

        // ---------- اتصال مجدد خودکار و نگه‌داشتن پیام‌ها ----------
        const SESSION_KEY = 'ourch4-session';
        let room = null;          // شناسه مخفی اتاق برای اتصال مجدد
        let roomSecret = null;    // کلید مشترک دو نفر؛ فقط از داخل کانال رمزشده رد و بدل می‌شود
        let firstOpenDone = false;
        let role = null;          // offerer یا answerer
        let chatLog = [];         // پیام‌های متنی و استیکر (فقط در همین تب)
        let restoring = false;
        let reconnecting = false;
        let reconnectLoop = null;
        let reconnectDeadline = 0;
        let disconnectTimer = null;

        function showChatUI() {
            document.getElementById('connection-panel').style.display = 'none';
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('messages-container').style.display = 'flex';
            document.getElementById('input-area').style.display = 'flex';
            document.body.style.backgroundColor = '#e5ddd5';
            adjustHeight();
        }

        function setBanner(text, color) {
            const b = document.getElementById('reconnect-banner');
            if (!b) return;
            if (!text) { b.style.display = 'none'; return; }
            b.textContent = text; b.style.display = 'block';
            b.style.background = color || '#fff3cd';
        }

        function saveSession() {
            try {
                if (!room) return;
                sessionStorage.setItem(SESSION_KEY, JSON.stringify({ room, roomSecret, role, chatLog }));
            } catch (e) {}
        }

        function logMessage(kind, data, dir, id) {
            if (restoring || !id) return;
            chatLog.push({ kind, data, dir, id });
            saveSession();
        }

        function unlogMessages(ids) {
            chatLog = chatLog.filter(m => !ids.includes(m.id));
            saveSession();
        }

        function onChannelOpen() {
            stopReconnect();
            setBanner('');
            lastPeerSeen = Date.now();
            peerVisible = true;
            sendCtl({ command: 'presence', vis: document.visibilityState });
            setTimeout(updatePresence, 50);
            const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
            if (!room && role === 'offerer') {
                room = hex(12);
                roomSecret = hex(32);
                try { dataChannel.send(JSON.stringify({ type: 'control', command: 'room', room, secret: roomSecret })); } catch (e) {}
            }
            saveSession();
            if (!firstOpenDone) { firstOpenDone = true; showSafetyCode(); }
        }

        function roomCode() { return 'room-' + room; }

        // کد امنیتی: از اثر انگشت رمزنگاری هر دو طرف ساخته می‌شود. اگر روی هر دو گوشی یکی باشد، نفر سومی وسط نیست.
        async function showSafetyCode() {
            try {
                const fp = sdp => ((sdp || '').match(/a=fingerprint:\S+ (\S+)/) || [])[1] || '';
                const parts = [fp(peerConnection.localDescription.sdp), fp(peerConnection.remoteDescription.sdp)].sort();
                const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.join('|'))));
                const num = ((h[0] << 16) | (h[1] << 8) | h[2]) % 1000000;
                const s = String(num).padStart(6, '0');
                const faDigits = s.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
                setBanner('کد امنیتی: ' + faDigits.slice(0, 3) + ' ' + faDigits.slice(3) + ' — با مخاطب (تلفنی یا حضوری) مقایسه کنید. اگر یکی نبود، گفتگو را پاکسازی کنید. (برای بستن لمس کنید)', '#d4edda');
                const b = document.getElementById('reconnect-banner');
                b.onclick = () => { b.onclick = null; setBanner(''); };
            } catch (e) {}
        }

        function stopReconnect() {
            reconnecting = false;
            if (reconnectLoop) { clearTimeout(reconnectLoop); reconnectLoop = null; }
            if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
            closeSignal();
        }

        function peerLeft() {
            stopReconnect();
            room = null;
            try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
            if (dataChannel) { dataChannel.onclose = null; try { dataChannel.close(); } catch(e) {} }
            if (peerConnection) peerConnection.close();
            cleanupCall();
            setBanner('مخاطب از گفتگو خارج شد.', '#f8d7da');
            updatePresence();
            const txt = document.getElementById('peer-status-text'); if (txt) txt.textContent = 'خارج شد';
        }

        // اگر force باشد، حتی وقتی کانال ظاهراً باز است (ولی مرده) اتصال از نو ساخته می‌شود
        async function startReconnect(force) {
            if (reconnecting) return;
            if (!force && dataChannel && dataChannel.readyState === 'open' && Date.now() - lastPeerSeen < 15000) return;
            if (!room) {
                setBanner('ارتباط قطع شد.', '#f8d7da');
                return;
            }
            reconnecting = true;
            updatePresence();
            try { cleanupCall(); hideCallModal(); } catch (e) {}
            reconnectDeadline = Date.now() + 10 * 60 * 1000;
            setBanner('ارتباط قطع شد؛ در حال اتصال مجدد...');
            if (!roomSecret) { reconnecting = false; setBanner('ارتباط قطع شد.', '#f8d7da'); return; }
            if (force && dataChannel) {
                try { if (dataChannel.readyState === 'open') dataChannel.send(JSON.stringify({ type: 'control', command: 'reconnect' })); } catch (e) {}
                if (role === 'answerer') {
                    dataChannel.onclose = null;
                    try { dataChannel.close(); } catch (e) {}
                    try { peerConnection.close(); } catch (e) {}
                }
            }
            signalKey = await deriveKey(roomSecret, 'room');

            if (role === 'answerer') {
                let busy = false;
                await signalListen(roomCode(), async msg => {
                    if (msg.k !== 'offer' || busy) return;
                    busy = true;
                    try {
                        const answerCode = await buildAnswer(msg.c);
                        await signalSend(roomCode(), { k: 'answer', to: msg.from, c: answerCode });
                    } catch (e) {}
                    busy = false;
                });
                reconnectLoop = setTimeout(reconnectGiveUp, 10 * 60 * 1000);
            } else {
                let me = '';
                await signalListen(roomCode(), async msg => {
                    if (msg.k !== 'answer' || msg.to !== me) return;
                    try { await applyAnswer(msg.c); } catch (e) {}
                });
                const attempt = async () => {
                    if (!reconnecting) return;
                    if (dataChannel && dataChannel.readyState === 'open') return;
                    if (Date.now() > reconnectDeadline) return reconnectGiveUp();
                    try {
                        me = Math.random().toString(36).slice(2, 10);
                        const offerCode = await buildOffer();
                        await signalSend(roomCode(), { k: 'offer', from: me, c: offerCode });
                    } catch (e) {}
                    reconnectLoop = setTimeout(attempt, 15000);
                };
                attempt();
            }
        }

        function reconnectGiveUp() {
            stopReconnect();
            setBanner('اتصال مجدد ممکن نشد. صفحه را باز نگه دارید و دوباره تلاش کنید.', '#f8d7da');
            const b = document.getElementById('reconnect-banner');
            b.onclick = () => { b.onclick = null; manualReconnect(); };
            updatePresence();
        }

        function manualReconnect() {
            if (!room || !roomSecret) { alert('اطلاعات اتاق در دسترس نیست؛ باید با عدد اتصال دوباره وصل شوید.'); return; }
            stopReconnect();
            startReconnect(true);
        }

        // ---------- وضعیت آنلاین مخاطب و فعالیت او ----------
        let lastPeerSeen = 0;
        let peerVisible = true;
        let peerTyping = false;
        let peerActivity = '';
        let lastActivityRender = 0;
        let lastHeartbeatTick = Date.now();

        function sendCtl(obj) {
            try { if (dataChannel && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify(Object.assign({ type: 'control' }, obj))); } catch (e) {}
        }

        function sendActivity(what) { sendCtl({ command: 'activity', what }); }

        function renderPeerActivity() {
            lastActivityRender = Date.now();
            const el = document.getElementById('typing-indicator');
            if (!el) return;
            let text = '';
            const ids = Object.keys(incomingFiles);
            if (ids.length) {
                const f = incomingFiles[ids[0]];
                const pct = f.totalBytes ? Math.floor(f.receivedBytes * 100 / f.totalBytes) : 0;
                const kind = mimeToType(f.mime);
                const label = kind === 'audio' ? 'صدا' : kind === 'video' ? 'فیلم' : kind === 'img' ? 'عکس' : 'فایل';
                text = 'در حال ارسال ' + label + ' ' + String(pct).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) + '٪';
            } else if (peerActivity === 'voice') text = '🎤 در حال ضبط صدا...';
            else if (peerActivity === 'video') text = '🎥 در حال ضبط فیلم...';
            else if (peerTyping) text = 'در حال تایپ...';
            el.textContent = text;
            el.style.display = text ? 'block' : 'none';
        }

        function updatePresence() {
            const dot = document.getElementById('peer-dot');
            const txt = document.getElementById('peer-status-text');
            if (!dot || !txt) return;
            const open = dataChannel && dataChannel.readyState === 'open';
            const fresh = Date.now() - lastPeerSeen < 12000;
            const iceBad = peerConnection && peerConnection.iceConnectionState === 'disconnected';
            let label, color;
            if (reconnecting) { label = 'در حال اتصال مجدد...'; color = '#ff9800'; }
            else if (open && fresh && !iceBad) {
                if (peerVisible) { label = 'آنلاین'; color = '#4caf50'; }
                else { label = 'بیرون از برنامه'; color = '#ffc107'; }
            } else if (open && !peerVisible) { label = 'بیرون از برنامه'; color = '#ffc107'; }
            else { label = 'آفلاین'; color = '#f44336'; }
            txt.textContent = label;
            dot.style.background = color;
            if (!open || !fresh) { peerTyping = false; peerActivity = ''; renderPeerActivity(); }
        }

        setInterval(() => {
            const now = Date.now();
            const frozen = now - lastHeartbeatTick > 10000;   // صفحه خودمان در پس‌زمینه خوابیده بود
            lastHeartbeatTick = now;
            if (frozen) { lastPeerSeen = Math.max(lastPeerSeen, now - 5000); }
            sendCtl({ command: 'ping', vis: document.visibilityState });
            updatePresence();
            // کانال باز است ولی مخاطبی که در برنامه بود ۲۰ ثانیه هیچ پیامی نفرستاده: اتصال مرده است
            if (!frozen && room && !reconnecting && document.visibilityState === 'visible' &&
                dataChannel && dataChannel.readyState === 'open' && peerVisible && lastPeerSeen && now - lastPeerSeen > 20000) {
                startReconnect(true);
            }
        }, 4000);

        document.addEventListener('visibilitychange', () => {
            sendCtl({ command: 'presence', vis: document.visibilityState });
        });

        function restoreSession() {
            let s = null;
            try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
            if (!s || !s.room) return;
            room = s.room; roomSecret = s.roomSecret; role = s.role; chatLog = s.chatLog || [];
            firstOpenDone = true;
            showChatUI();
            restoring = true;
            chatLog.forEach(m => {
                if (m.kind === 'text') addMessageToChat(m.data, m.dir, m.id, m.edited);
                else addStickerToChat(m.data, m.dir, m.id);
            });
            restoring = false;
            startReconnect();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && room && !reconnecting) {
                if (!dataChannel || dataChannel.readyState !== 'open') startReconnect();
                else if (peerConnection && ['disconnected', 'failed'].includes(peerConnection.iceConnectionState)) startReconnect(true);
            }
        });

        restoreSession();
        // ===== دکمه back: بستن پنجره‌ها، خروج از تمام‌صفحه، و تایید خروج =====
        let confirmExitApp = () => {}, hideExitModal = () => {};
        (function () {
            let allowExit = false;
            let depth = 0;            // تعداد ورودی‌های تاریخچه‌ای که ما اضافه کرده‌ایم
            let gestureArmed = false; // کروم ورودی‌ای را که بدون لمس کاربر ساخته شده نادیده می‌گیرد
            const trap = () => { try { history.pushState({ ourch4: Date.now() }, '', location.href); depth++; } catch (e) {} };
            const arm = () => { if (!gestureArmed && !allowExit) { trap(); gestureArmed = true; } };
            ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, arm, true));

            const isShown = id => { const el = document.getElementById(id); return el && getComputedStyle(el).display !== 'none'; };
            const hide = id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; };

            hideExitModal = () => hide('exit-modal');
            confirmExitApp = () => {
                allowExit = true;
                hide('exit-modal');
                try { history.go(-(depth + 1)); } catch (e) {}
                setTimeout(() => { try { window.close(); } catch (e) {} }, 400);
            };

            window.addEventListener('popstate', () => {
                if (allowExit) return;
                depth = Math.max(0, depth - 1);
                gestureArmed = false;
                trap();   // تلاش برای نگه داشتن کاربر؛ با اولین لمس بعدی دوباره محکم می‌شود

                // ۱) اگر فیلم تمام‌صفحه است فقط از تمام‌صفحه خارج شو
                const fs = document.fullscreenElement || document.webkitFullscreenElement;
                if (fs) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} return; }
                // ۲) پنجره‌ها و پنل‌های باز را به ترتیب ببند
                if (isShown('exit-modal')) { hide('exit-modal'); return; }
                if (isShown('sticker-panel')) { hide('sticker-panel'); return; }
                if (isShown('preview-modal')) { cancelSendMedia(); return; }
                if (isShown('delete-modal')) { hideDeleteModal(); return; }
                if (isShown('wipe-modal')) { hideWipeModal(); return; }
                if (isShown('in-app-record-modal')) { closeInAppRecordModal(); return; }
                if (isShown('video-call-modal') || (isShown('call-modal'))) return; // تماس با back قطع نمی‌شود
                if (selectedMessages.length) { clearSelection(); return; }
                if (editingId) { cancelEdit(); return; }
                // ۳) پخش فیلم را متوقف کن و تایید خروج بخواه
                document.querySelectorAll('video, audio').forEach(v => { if (v.id !== 'remote-video' && v.id !== 'local-video' && v.id !== 'remote-audio' && !v.paused) { try { v.pause(); } catch (e) {} } });
                document.getElementById('exit-modal').style.display = 'flex';
            });

            window.addEventListener('beforeunload', (e) => {
                if (allowExit) return;
                e.preventDefault();
                e.returnValue = '';
                return '';
            });
        })();
    </script>
</body>
</html>
