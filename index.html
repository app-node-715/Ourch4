<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>App</title>
    <style>
        @font-face { font-family: 'B Titr'; src: local('B Titr'); }
        @font-face { font-family: 'B Nazanin'; src: local('B Nazanin'); }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            touch-action: manipulation;
        }
        
        body {
            font-family: 'B Nazanin', Tahoma, Arial, sans-serif;
            background-color: #e5ddd5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100vw;
            transition: background-color 0.3s;
        }
        
        .chat-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            height: 100%; 
            position: relative; 
        }
        
        @media (min-width: 600px) {
            .chat-container {
                height: 95vh;
                margin-top: 2.5vh;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            }
        }
        
        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 8px 15px;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            font-size: 16px;
            display: none;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #054c44;
            z-index: 10;
            min-height: 35px;
            flex-shrink: 0;
        }
        
        .title-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            line-height: 1.25;
            min-width: 0;
        }
        .title-container .typing-indicator { margin-right: 0; font-size: 12px; }
        .title-container .peer-status { margin-right: 0; }
        
        .typing-indicator {
            display: none;
            font-family: 'B Nazanin', Tahoma, Arial, sans-serif;
            font-size: 14px;
            color: #b2dfdb;
            margin-right: 8px;
            font-weight: normal;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        
        .action-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 51px;
            background-color: #fff;
            z-index: 20;
            display: none; 
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            color: #000;
        }
        
        .header-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .btn-call {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 4px 9px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-call:hover { background-color: #1ebe57; }
        
        .btn-disconnect {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            font-size: 13px;
        }
        
        .connection-panel {
            background-color: #f9f9f9;
            padding: 20px 15px;
            display: flex; /* نمایش مستقیم بدون نیاز به کلیک */
            flex-direction: column;
            gap: 10px;
            border-radius: 10px;
            margin: auto 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            border: 1px solid #eee;
            z-index: 60;
        }
        .connection-panel textarea {
            width: 95%;
            height: 55px;
            padding: 8px;
            font-size: 11px;
            direction: ltr;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: monospace;
            align-self: center;
        }
        .quick-code { font-size: 34px; letter-spacing: 8px; text-align: center; font-family: monospace; color: #075e54; font-weight: bold; direction: ltr; }
        .quick-input { width: 60%; align-self: center; font-size: 26px; letter-spacing: 6px; text-align: center; padding: 6px; border: 1px solid #ccc; border-radius: 6px; direction: ltr; font-family: monospace; }
        .manual-box summary { cursor: pointer; font-size: 12px; color: #666; text-align: center; margin-top: 6px; }
        .manual-box { display: flex; flex-direction: column; gap: 10px; }
        .manual-box[open] { gap: 10px; }
        .reconnect-banner { display: none; position: sticky; top: 0; z-index: 55; background: #fff3cd; color: #856404; text-align: center; font-size: 13px; padding: 6px; border-bottom: 1px solid #ffe08a; }
        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            font-size: 13px;
        }
        .btn:hover { background-color: #075e54; }
        .btn-alt { background-color: #25d366; color: #000; }
        .btn-alt:hover { background-color: #1ebe57; }
        .btn-danger { background-color: #d9534f; color: white; }
        
        .chat-messages {
            flex: 1; 
            padding: 12px 15px;
            overflow-y: auto;
            background-color: #efeae2;
            display: none; 
            flex-direction: column;
            gap: 8px;
            touch-action: pan-y; 
        }
        .message {
            max-width: 80%;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .message.selected {
            background-color: #b3d4fc !important;
            box-shadow: 0 0 0 3px #0056b3;
        }
        
        .message img, .message video {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
        }
        .message video { max-height: 250px; background: #000; }
        .sent { background-color: #dcf8c6; align-self: flex-start; border-top-right-radius: 0; }
        .received { background-color: #ffffff; align-self: flex-end; border-top-left-radius: 0; }
        
        .media-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .download-btn {
            display: block;
            text-align: center;
            background-color: #34b7f1;
            color: white;
            text-decoration: none;
            padding: 5px;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 13px;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
        }

        .message.sticker-msg {
            background-color: transparent;
            box-shadow: none;
            font-size: 45px;
            padding: 0;
            margin: 2px 8px;
        }
        
        .chat-input-area {
            display: none; 
            align-items: center;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ddd;
            position: relative;
            flex-shrink: 0;
        }
        
        .send-btn {
            background-color: #128c7e;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            margin-left: 10px; 
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 4px; 
            flex-shrink: 0;
        }
        
        #message-input {
            flex: 1;
            resize: none;
            box-sizing: border-box;
            line-height: 1.4;
            max-height: 110px;
            overflow-y: auto;
            height: 38px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-family: 'B Nazanin', Tahoma, Arial, sans-serif;
            font-size: 15px;
            outline: none;
            min-width: 0;
        }
        
        .icon-btn {
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 4px; 
            flex-shrink: 0;
        }
        .emoji-btn { background-color: #ffcc00; }
        .attach-btn { background-color: #34b7f1; }
        .video-record-btn { background-color: #e91e63; }
        .voice-btn { background-color: #4caf50; }
        .voice-btn.recording { background-color: #d9534f; animation: recPulse 1s infinite; }
        @keyframes recPulse { 50% { opacity: 0.55; } }
        .voice-rec-bar, .edit-bar { display: none; position: absolute; bottom: 100%; left: 0; right: 0; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; font-weight: bold; font-size: 14px; z-index: 40; border-top: 1px solid #ddd; }
        .voice-rec-bar { background: #fff0f0; color: #d9534f; }
        .edit-bar { background: #e8f5e9; color: #075e54; }
        .edit-bar .edit-preview { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: normal; color: #555; }
        .edit-bar button { background: #eee; color: #333; border: none; border-radius: 14px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
        .msg-text { white-space: pre-wrap; }
        .media-container video, .media-container audio { -webkit-touch-callout: none; }
        .hold-hint { font-size: 11px; color: #888; display: block; margin-top: 2px; }
        .call-rec-on { background-color: #d9534f !important; animation: blink 1.2s infinite; }
        .bg-music-name { font-size: 12px; color: #075e54; margin-top: 4px; display: none; }
        .edited-tag { font-size: 11px; color: #888; margin-right: 6px; }
        .send-progress { font-size: 12px; color: #666; }
        .peer-status { font-family: Tahoma, Arial, sans-serif; font-size: 12px; font-weight: normal; margin-right: 8px; color: #b2dfdb; white-space: nowrap; }
        .peer-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 4px; background: #9e9e9e; }
        .btn-reconnect { background-color: #ff9800; }
        #in-app-record-modal { align-items: flex-start; padding-top: 55px; background: transparent; pointer-events: none; height: auto; bottom: 70px; }
        #in-app-record-modal .modal-content { pointer-events: auto; width: 250px !important; padding: 8px; }
        #in-app-record-video { max-height: 28vh; }
        .tap-to-play { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); z-index: 2030; background: rgba(0,0,0,0.75); color: #fff; padding: 12px 18px; border-radius: 10px; display: none; cursor: pointer; font-family: Tahoma, Arial, sans-serif; }
        .voice-rec-bar .cancel-voice { background: #eee; color: #333; border: none; border-radius: 14px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
        .message audio { width: 240px; max-width: 100%; margin-top: 4px; display: block; }
        .file-card { display: flex; align-items: center; gap: 8px; padding: 6px 4px; word-break: break-all; }
        .file-card .file-icon { font-size: 30px; }
        .file-card .file-meta { font-size: 12px; color: #666; }
        #preview-container .file-card { justify-content: center; font-size: 15px; }
        
        .status { text-align: center; font-size: 13px; color: #d9534f; font-weight: bold; }
        
        .sticker-panel {
            display: none;
            position: absolute;
            bottom: 65px;
            left: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            z-index: 100;
            max-height: 280px;
            width: calc(100% - 44px);
            max-width: 420px;
            overflow-y: auto;
        }
        .sticker-panel span { font-size: 28px; cursor: pointer; text-align: center; user-select: none; }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 15px; border-radius: 10px;
            max-width: 85%; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .modal-content img, .modal-content video {
            max-width: 100%; max-height: 45vh; border-radius: 8px; margin-bottom: 10px; background: #000;
        }
        
        .call-content {
            background: #075e54; 
            color: white; 
            padding: 22px 18px; 
            border-radius: 15px;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 250px;
        }

        #in-app-record-video {
            width: 100%;
            max-height: 40vh;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
        }
        .record-timer-text {
            color: #d9534f;
            font-weight: bold;
            font-size: 14px;
            margin: 8px 0;
            display: none;
        }

        .video-call-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000;
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }
        #remote-video {
            width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;
        }
        #local-video {
            position: absolute; top: 20px; right: 20px;
            width: 100px; height: 140px; object-fit: cover;
            border-radius: 10px; border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2010;
            transform: scaleX(-1);
        }
        .video-call-controls {
            position: absolute; bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 20px;
            z-index: 2020;
        }
        .call-action-circle {
            width: 55px; height: 55px; border-radius: 50%;
            border: none; color: white; font-size: 22px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <audio id="remote-audio" autoplay playsinline style="display:none;"></audio>

    <div class="chat-container" id="main-container">
        
        <div class="chat-header" id="chat-header">
            <div class="title-container">
                <span id="chat-title"></span>
                <span id="peer-status" class="peer-status"><span class="dot" id="peer-dot"></span><span id="peer-status-text">در حال اتصال...</span></span>
                <span id="typing-indicator" class="typing-indicator">در حال تایپ...</span>
            </div>
            
            <div class="header-btns">
                <button class="btn-call btn-reconnect" id="reconnect-btn" onclick="manualReconnect()" title="اتصال مجدد">🔄</button>
                <button class="btn-call" id="call-btn" onclick="startCall(false)" title="تماس صوتی">📞</button>
                <button class="btn-call" id="video-call-btn" onclick="startCall(true)" style="background-color: #0088cc;" title="تماس تصویری">📹</button>
                <button class="btn-disconnect" id="disconnect-btn" onclick="showWipeModal()">پاکسازی</button>
            </div>
        </div>
        
        <div class="action-bar" id="action-bar">
            <span id="selection-count">۱ پیام</span>
            <div class="header-btns">
                <button class="icon-btn" id="edit-msg-btn" onclick="startEditSelected()" style="background-color: #128c7e; display:none;" title="ویرایش">✏️</button>
                <button class="icon-btn" onclick="showDeleteModal()" style="background-color: #d9534f;" title="حذف">🗑</button>
                <button class="icon-btn" onclick="clearSelection()" style="background-color: #6c757d;" title="لغو">❌</button>
            </div>
        </div>
        
        <div id="delete-modal" class="modal-overlay">
            <div class="call-content" style="background-color: #fff; color: #000; border: 2px solid #ddd;">
                <h3 style="color:#d9534f; margin-bottom: 20px;">حذف پیام</h3>
                <div class="btn-group" style="flex-direction:column; gap:10px;">
                    <button class="btn btn-danger" onclick="executeDelete('everyone')">برای هر دو نفر</button>
                    <button class="btn btn-alt" style="background:#f0ad4e; color:#fff;" onclick="executeDelete('me')">فقط برای من</button>
                    <button class="btn" style="background-color: #6c757d;" onclick="hideDeleteModal()">انصراف</button>
                </div>
            </div>
        </div>
        
        <div id="wipe-modal" class="modal-overlay">
            <div class="call-content" style="background-color: #fff; color: #000; border: 2px solid #ddd;">
                <h3 style="color:#d9534f; margin-bottom: 15px; font-size:16px;">پاکسازی و خروج</h3>
                <div class="btn-group" style="flex-direction:column; gap:10px;">
                    <button class="btn btn-danger" onclick="executeWipeChoice('everyone')">برای هر دو نفر و قطع ارتباط</button>
                    <button class="btn btn-alt" style="background:#f0ad4e; color:#fff;" onclick="executeWipeChoice('me')">فقط برای من و قطع ارتباط</button>
                    <button class="btn" style="background-color: #6c757d;" onclick="hideWipeModal()">انصراف</button>
                </div>
            </div>
        </div>

        <div id="exit-modal" class="modal-overlay">
            <div class="call-content" style="background-color: #fff; color: #000; border: 2px solid #ddd;">
                <h3 style="margin-bottom: 18px; font-size:16px;">آیا می‌خواهید از برنامه خارج شوید؟</h3>
                <div class="btn-group">
                    <button class="btn btn-danger" onclick="confirmExitApp()">خروج</button>
                    <button class="btn" style="background-color: #6c757d;" onclick="hideExitModal()">ماندن</button>
                </div>
            </div>
        </div>

        <div id="preview-modal" class="modal-overlay">
            <div class="modal-content">
                <div id="preview-container"></div>
                <div class="btn-group">
                    <button class="btn" id="confirm-media-btn" onclick="confirmSendMedia()">ارسال</button>
                    <button class="btn btn-danger" onclick="cancelSendMedia()">انصراف</button>
                </div>
            </div>
        </div>

        <div id="in-app-record-modal" class="modal-overlay">
            <div class="modal-content" style="width: 310px;">
                <video id="in-app-record-video" autoplay playsinline muted></video>
                <div class="bg-music-name" id="bg-music-name"></div>
                <input type="file" id="bg-music-input" accept="audio/*" style="display:none;">
                <div id="rec-timer" class="record-timer-text">⏺ ضبط: <span id="rec-sec">0</span> ثانیه</div>
                <div class="btn-group" style="margin-top: 10px;">
                    <button class="btn" onclick="switchRecordCamera()" style="background-color: #34b7f1;" title="چرخش">🔄</button>
                    <button class="btn" id="bg-music-btn" onclick="pickBgMusic()" style="background-color: #8e44ad;" title="آهنگ زمینه">🎵</button>
                    <button id="start-rec-btn" class="btn btn-danger" onclick="startInAppRecording()">شروع ضبط</button>
                    <button id="stop-rec-btn" class="btn" style="display:none; background-color:#e6b800;" onclick="stopInAppRecording()">توقف</button>
                    <button class="btn" style="background-color: #6c757d;" onclick="closeInAppRecordModal()">بستن</button>
                </div>
            </div>
        </div>

        <div id="call-modal" class="modal-overlay">
            <div class="call-content">
                <h3 id="call-status-text">در حال برقراری تماس...</h3>
                <div class="btn-group" id="call-incoming-btns" style="display:none; margin-top: 20px;">
                    <button class="btn btn-alt" onclick="acceptCall()">پاسخ</button>
                    <button class="btn btn-danger" onclick="rejectCall()">رد</button>
                </div>
                <div class="btn-group" id="call-active-btns" style="display:none; margin-top: 20px;">
                    <button class="btn" id="call-rec-btn-audio" onclick="toggleCallRecording()" style="background-color:#6c757d;">⏺ ضبط تماس</button>
                    <button class="btn btn-danger" onclick="endCall()">قطع تماس</button>
                </div>
            </div>
        </div>
        
        <div id="video-call-modal" class="video-call-overlay">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="tap-to-play" id="tap-to-play" onclick="resumeRemoteMedia()">🔊 برای شنیدن صدا لمس کنید</div>
            <div class="video-call-controls">
                <button class="call-action-circle" onclick="switchCamera()" style="background-color: #34b7f1;" title="چرخش دوربین">🔄</button>
                <button class="call-action-circle" id="mute-mic-btn" onclick="toggleMute()" style="background-color: #6c757d;" title="میکروفون">🎙️</button>
                <button class="call-action-circle" id="call-rec-btn-video" onclick="toggleCallRecording()" style="background-color: #6c757d;" title="ضبط تماس">⏺</button>
                <button class="call-action-circle" onclick="endCall()" style="background-color: #d9534f;" title="قطع تماس">🛑</button>
            </div>
        </div>

        <!-- پنل اتصال فعال در بدو ورود -->
        <div class="connection-panel" id="connection-panel">
            <div class="status" id="status-text">در انتظار اتصال...</div>
            
            <div class="quick-code" id="quick-code"></div>
            <div class="btn-group">
                <button class="btn" onclick="hostQuick()">ساخت عدد اتصال</button>
            </div>
            <input id="quick-input" class="quick-input" type="tel" inputmode="numeric" maxlength="6" placeholder="------">
            <div class="btn-group">
                <button class="btn btn-alt" onclick="joinQuick()">اتصال با عدد مخاطب</button>
            </div>

            <details class="manual-box">
                <summary>اتصال دستی با کد (بدون سرور واسط)</summary>
                <textarea id="my-code" placeholder="کد شما اینجا تولید می‌شود" readonly onclick="this.select()"></textarea>
                <button id="copy-btn" class="btn" onclick="copyMyCode()" style="display:none; background-color:#34b7f1; width:95%; align-self:center; font-size:13px;">📋 کپی کردن کد برای ارسال</button>
                <textarea id="peer-code" placeholder="کد مخاطب را اینجا وارد کنید"></textarea>
                <div class="btn-group">

        // --- کد کوتاه: حذف خطوط اضافه SDP + فشرده‌سازی ---
        function slimSdp(sdp) {
            const seen = new Set();
            return sdp.split('\r\n').filter(line => {
                if (!line) return false;
                if (line.startsWith('a=candidate:')) {
                    if (/ tcp /i.test(line)) return false;          // کاندیدهای TCP معمولاً بی‌فایده‌اند
                    if (/\.local /.test(line)) return false;        // آدرس mDNS بین دو شبکه کار نمی‌کند
                    const key = line.split(' ').slice(4, 6).join(':');
                    if (seen.has(key)) return false;                 // حذف تکراری‌ها
                    seen.add(key);
                }
                if (line.startsWith('a=extmap') || line.startsWith('a=msid-semantic')) return false;
                return true;
            }).join('\r\n') + '\r\n';
        }

        function watchConnection(pc) {
            pc.addEventListener('iceconnectionstatechange', () => {
                const st = document.getElementById('status-text');
                if (pc !== peerConnection) return;
                if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                    if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
                }
                if (room && pc.iceConnectionState === 'disconnected') {
                    updatePresence();
                    if (!disconnectTimer) disconnectTimer = setTimeout(() => {
                        disconnectTimer = null;
                        if (pc === peerConnection && pc.iceConnectionState !== 'connected' && pc.iceConnectionState !== 'completed') startReconnect(true);
                    }, 6000);
                    return;
                }
                if (room && pc.iceConnectionState === 'failed') { startReconnect(true); return; }
                if (pc.iceConnectionState === 'checking') { st.textContent = 'در حال برقراری اتصال...'; st.style.color = '#128c7e'; }
                if (pc.iceConnectionState === 'failed') {
                    st.textContent = 'اتصال برقرار نشد. یکی از دو طرف شبکه را عوض کند (وای‌فای/داده همراه) و دوباره «ایجاد کد» بزند.';
                    st.style.color = '#d9534f';
                }
            });
        }

        async function encodeCode(desc) {
            const json = JSON.stringify({ t: desc.type === 'offer' ? 'o' : 'a', s: slimSdp(desc.sdp) });
            try {
                const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                const buf = new Uint8Array(await new Response(stream).arrayBuffer());
                let bin = ''; buf.forEach(b => bin += String.fromCharCode(b));
                return 'Z' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                return btoa(JSON.stringify(desc));
            }
        }

        async function decodeCode(code) {
            code = code.replace(/\s+/g, '');
            if (code[0] !== 'Z') return JSON.parse(atob(code));     // سازگار با کدهای قدیمی
            let b64 = code.slice(1).replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const bin = atob(b64);
            const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            const o = JSON.parse(await new Response(stream).text());
            return { type: o.t === 'o' ? 'offer' : 'answer', sdp: o.s };
        }

        function waitForAllIceCandidates(pc) {

                    resolve();
                } else {

                        if (pc.iceGatheringState === 'complete') {
                            pc.removeEventListener('icegatheringstatechange', checkState);
                            resolve();
                        }
                    };
                    pc.addEventListener('icegatheringstatechange', checkState);
                    setTimeout(() => {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();

        // ---------- اتصال سریع با عدد ۶ رقمی (سرور واسط: ntfy.sh) ----------
        const SIGNAL_URL = 'https://ntfy.sh/';
        let signalSource = null;
        let signalTimer = null;

        function signalTopic(code) { return 'ourch4-p2p-k7x3-' + code; }

        function closeSignal() {
            if (signalSource) { signalSource.close(); signalSource = null; }
            if (signalTimer) { clearTimeout(signalTimer); signalTimer = null; }
        }

        // پیام‌های سرور واسط رمزنگاری و امضا می‌شوند؛ پیامی که با کلید درست ساخته نشده باشد نادیده گرفته می‌شود
        let signalKey = null;

        function b64(bytes) { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
        function unb64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

        async function deriveKey(secret, purpose) {
            const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: new TextEncoder().encode('ourch4-' + purpose), iterations: 150000, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
        }

        async function sealMsg(key, obj) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
            return { v: b64(iv), e: b64(ct) };
        }

        async function openMsg(key, box) {
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.v) }, key, unb64(box.e));
            return JSON.parse(new TextDecoder().decode(pt));
        }

        async function signalSend(code, obj) {
            if (!signalKey) throw new Error('no key');
            const box = await sealMsg(signalKey, Object.assign({ ts: Date.now() }, obj));
            await fetch(SIGNAL_URL + signalTopic(code), { method: 'POST', body: JSON.stringify(box) });
        }

        function signalListen(code, onMsg) {
            closeSignal();
            const since = Math.floor(Date.now() / 1000) - 5;
            signalSource = new EventSource(SIGNAL_URL + signalTopic(code) + '/sse?since=' + since);
            const key = signalKey;
            signalSource.onmessage = async ev => {
                try {
                    const outer = JSON.parse(ev.data);
                    if (outer.event && outer.event !== 'message') return;
                    const msg = await openMsg(key, JSON.parse(outer.message));   // کلید اشتباه = خطا = نادیده
                    if (!msg.ts || Math.abs(Date.now() - msg.ts) > 2 * 60 * 1000) return; // پیام قدیمی/تکراری
                    onMsg(msg);
                } catch (e) {}
            };
            signalSource.onerror = () => {
                if (signalSource && signalSource.readyState === EventSource.CLOSED) {
                    setStatus('سرور واسط در دسترس نیست. از «اتصال دستی» استفاده کنید.', '#d9534f');
                }
            };
            return new Promise(resolve => { signalSource.onopen = () => resolve(); setTimeout(resolve, 4000); });
        }

        function startSignalTimeout(seconds) {
            signalTimer = setTimeout(() => {
                closeSignal();
                setStatus('مخاطب پیدا نشد. دوباره امتحان کنید.', '#d9534f');
            }, seconds * 1000);
        }

        function setupDataChannel() {
            dataChannel.binaryType = 'arraybuffer';
            
            dataChannel.onopen = () => {
                closeSignal();
                showChatUI();
                onChannelOpen();
            };
            
            dataChannel.onclose = () => startReconnect();
            
            dataChannel.onmessage = event => {
                lastPeerSeen = Date.now();
                if (typeof event.data === 'string') {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'text') {
                        peerTyping = false; renderPeerActivity();
                        addMessageToChat(msg.data, 'received', msg.id);
                    } else if (msg.type === 'sticker') {
                        addStickerToChat(msg.data, 'received', msg.id);
                    } else if (msg.type === 'edit') {
                        applyEdit(msg.id, msg.data, 'received');
                    } else if (msg.type === 'file-start') {
                        incomingFiles[msg.id] = {
                            mime: msg.mime,
                            name: msg.name || '',
                            chunks: [],
                            receivedBytes: 0,
                            totalBytes: msg.size
                        };
                        renderPeerActivity();
                    } else if (msg.type === 'file-end') {
                        const fileData = incomingFiles[msg.id];
                        if (fileData) {
                            const blob = new Blob(fileData.chunks, { type: fileData.mime });
                            const url = URL.createObjectURL(blob);
                            displayBlobInChat(url, mimeToType(fileData.mime), 'received', msg.id, fileData.name, blob.size);
                            delete incomingFiles[msg.id];
                        }
                        renderPeerActivity();
                    } else if (msg.type === 'control') {
                        if (msg.command === 'disconnect') {
                            executeSilentWipe();
                        } else if (msg.command === 'room') {
                            if (!room && role === 'answerer') {
                                room = msg.room;
                                roomSecret = msg.secret;
                                saveSession();
                            }
                        } else if (msg.command === 'left') {
                            peerLeft();
                        } else if (msg.command === 'delete-messages') {
                            msg.ids.forEach(id => {
                                const el = document.querySelector(`[data-msg-id="${id}"]`);
                                if (el) el.remove();
                            });
                            unlogMessages(msg.ids);
                        } else if (msg.command === 'typing') {
                            peerTyping = true; renderPeerActivity();
                        } else if (msg.command === 'stop-typing') {
                            peerTyping = false; renderPeerActivity();
                        } else if (msg.command === 'activity') {
                            peerActivity = msg.what || ''; renderPeerActivity();
                        } else if (msg.command === 'ping') {
                            peerVisible = msg.vis !== 'hidden';
                            updatePresence();
                        } else if (msg.command === 'presence') {
                            peerVisible = msg.vis !== 'hidden';
                            updatePresence();
                        } else if (msg.command === 'call-recording') {
                            const note = msg.on ? '⏺ مخاطب در حال ضبط تماس است' : 'ضبط تماس توسط مخاطب متوقف شد';
                            setBanner(note, msg.on ? '#f8d7da' : '#d4edda');
                            if (!msg.on) setTimeout(() => setBanner(''), 3000);
                        } else if (msg.command === 'reconnect') {
                            startReconnect(true);
                        }
                    } else if (msg.type === 'call-offer') handleCallOffer(msg.sdp, msg.isVideo);
                    else if (msg.type === 'call-answer') handleCallAnswer(msg.sdp);
                    else if (msg.type === 'call-candidate') handleCallCandidate(msg.candidate);
                    else if (msg.type === 'call-reject') handleCallReject();
                    else if (msg.type === 'call-end') handleCallEnd();
                } else if (event.data instanceof ArrayBuffer) {
                    const view = new DataView(event.data);
                    const idLen = view.getUint8(0);
                    const idBytes = new Uint8Array(event.data, 1, idLen);
                    const id = new TextDecoder().decode(idBytes);
                    const chunk = event.data.slice(1 + idLen);

                    if (incomingFiles[id]) {
                        incomingFiles[id].chunks.push(chunk);
                        incomingFiles[id].receivedBytes += chunk.byteLength;
                        if (Date.now() - lastActivityRender > 400) renderPeerActivity();
                    }
                }
            };
        }

                    cancelEdit();
                    document.getElementById('sticker-panel').style.display = 'none';
                    input.focus();
                }
                return;

            if (txt !== "" && dataChannel && dataChannel.readyState === 'open') {
                const msgId = generateUniqueId();
                dataChannel.send(JSON.stringify({ type: 'text', id: msgId, data: txt }));
                addMessageToChat(txt, 'sent', msgId);
                input.value = '';
                autoSizeInput();
                document.getElementById('sticker-panel').style.display = 'none'; // بستن پنل استیکر بعد از ارسال

        function formatSize(bytes) {
            if (!bytes && bytes !== 0) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';

        function displayBlobInChat(blobUrl, mediaType, alignment, msgId, fileName, fileSize) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.classList.add('message', alignment);
            if(msgId) div.setAttribute('data-msg-id', msgId);
            div.onclick = (e) => toggleSelection(msgId, e);
            
            const mediaWrapper = document.createElement('div');
            mediaWrapper.className = 'media-container';
            
            let el;
            if (mediaType === 'video') {
                el = document.createElement('video');
                el.controls = true;
                el.playsInline = true;
                el.preload = 'auto';
                el.src = blobUrl;
            } else if (mediaType === 'audio') {
                el = document.createElement('audio');
                el.controls = true;
                el.preload = 'auto';
                el.src = blobUrl;
                el.onclick = (e) => e.stopPropagation();
            } else if (mediaType === 'file') {
                el = buildFileCard(fileName, fileSize);
            } else {
                el = document.createElement('img');
                el.src = blobUrl;
            }
            mediaWrapper.appendChild(el);
            
            const dlName = fileName || ((mediaType === 'video') ? 'video.mp4' : (mediaType === 'audio') ? 'voice.webm' : (mediaType === 'file') ? 'file' : 'image.png');
            if (mediaType === 'video' || mediaType === 'audio') {
                // دکمه دانلود حذف شد؛ با نگه داشتن انگشت روی فیلم/وویس دانلود می‌شود
                attachLongPressDownload(div, blobUrl, dlName);
            } else {
                const downloadLink = document.createElement('a');
                downloadLink.href = blobUrl;
                downloadLink.download = dlName;
                downloadLink.onclick = (e) => e.stopPropagation();
                downloadLink.className = 'download-btn';
                downloadLink.textContent = '⬇️ دانلود';
                mediaWrapper.appendChild(downloadLink);
            }
            div.appendChild(mediaWrapper);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            
            el.onload = () => { container.scrollTop = container.scrollHeight; };
            el.onloadeddata = () => { container.scrollTop = container.scrollHeight; };
            return div;
        }

        function downloadBlob(url, name) {
            const a = document.createElement('a');
            a.href = url; a.download = name; a.style.display = 'none';
            document.body.appendChild(a); a.click();
            setTimeout(() => a.remove(), 1000);
        }

        function attachLongPressDownload(target, url, name) {
            let timer = null, sx = 0, sy = 0, fired = false;
            const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
            target.addEventListener('contextmenu', e => e.preventDefault());
            target.addEventListener('pointerdown', e => {
                fired = false; sx = e.clientX; sy = e.clientY; cancel();
                timer = setTimeout(() => {
                    timer = null; fired = true;
                    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (er) {} }
                    if (confirm('این فایل دانلود شود؟')) downloadBlob(url, name);
                }, 600);
            });
            target.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12) cancel(); });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => target.addEventListener(ev, cancel));
            // بعد از نگه داشتن، لمس به معنی انتخاب پیام حساب نشود
            target.addEventListener('click', e => { if (fired) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
        }

        async function initRecordCamera(facing) {

        // ---------- آهنگ زمینه برای فیلم ----------
        let bgMusicUrl = null, bgAudioEl = null, bgCtx = null, bgSrcNode = null;

        function pickBgMusic() {

        document.getElementById('bg-music-input').addEventListener('change', function (e) {

        function stopBgMusic(forget) {
            if (bgAudioEl) { try { bgAudioEl.pause(); } catch (e) {} }
            if (bgCtx) { try { bgCtx.close(); } catch (e) {} }
            bgAudioEl = null; bgCtx = null; bgSrcNode = null;
            if (forget) {
                if (bgMusicUrl) URL.revokeObjectURL(bgMusicUrl);
                bgMusicUrl = null;
                const n = document.getElementById('bg-music-name');
                n.style.display = 'none'; n.textContent = '';
            }
        }

        // صدای میکروفون + آهنگ انتخاب‌شده را با هم ترکیب می‌کند
        function buildRecordStream() {
            if (!bgMusicUrl || !recStream) return recStream;
            try {
                bgCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = bgCtx.createMediaStreamDestination();
                if (recStream.getAudioTracks().length) {
                    bgCtx.createMediaStreamSource(new MediaStream(recStream.getAudioTracks())).connect(dest);
                }
                bgAudioEl = new Audio(bgMusicUrl);
                bgAudioEl.loop = true;
                bgSrcNode = bgCtx.createMediaElementSource(bgAudioEl);
                const musicGain = bgCtx.createGain(); musicGain.gain.value = 0.6;
                bgSrcNode.connect(musicGain);
                musicGain.connect(dest);                 // داخل فیلم
                const monitor = bgCtx.createGain(); monitor.gain.value = 0.35;
                musicGain.connect(monitor); monitor.connect(bgCtx.destination);   // آرام از بلندگو هم شنیده شود
                bgAudioEl.play().catch(() => {});
                return new MediaStream([...recStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
            } catch (e) {
                return recStream;
            }
        }

        function startInAppRecording() {
            recChunks = [];

            let chosenMime = 'video/webm;codecs=vp8,opus';
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                chosenMime = 'video/mp4';
            } else if (!MediaRecorder.isTypeSupported(chosenMime)) {
                chosenMime = '';
            }

            const recOptions = chosenMime ? {
                mimeType: chosenMime,
                videoBitsPerSecond: 450000
            } : { videoBitsPerSecond: 450000 };

            const streamToRecord = buildRecordStream();
            try {
                internalRecorder = new MediaRecorder(streamToRecord, recOptions);
            } catch(e) {
                internalRecorder = new MediaRecorder(streamToRecord);
            }

            internalRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) recChunks.push(e.data);
            };

            internalRecorder.onstop = () => {
                const recordedType = internalRecorder.mimeType || 'video/mp4';
                pendingMediaBlob = new Blob(recChunks, { type: recordedType });
                pendingMediaType = 'video';
                
                closeInAppRecordModal();

                const previewContainer = document.getElementById('preview-container');
                previewContainer.innerHTML = '';
                const v = document.createElement('video');
                v.controls = true;
                v.playsInline = true;

                document.getElementById('confirm-media-btn').textContent = 'ارسال';
                document.getElementById('confirm-media-btn').disabled = false;
                document.getElementById('preview-modal').style.display = 'flex';
            };

            internalRecorder.start(500);
            sendActivity('video');
            recSecCount = 0;
            document.getElementById('rec-sec').textContent = recSecCount;
            document.getElementById('rec-timer').style.display = 'block';
            document.getElementById('start-rec-btn').style.display = 'none';
            document.getElementById('stop-rec-btn').style.display = 'inline-block';

            recTimerInterval = setInterval(() => {
                recSecCount++;

        }

        document.getElementById('media-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
