<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>App</title>
    <style>
        @font-face { font-family: 'B Titr'; src: local('B Titr'); }
        @font-face { font-family: 'B Nazanin'; src: local('B Nazanin'); }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            touch-action: manipulation;
        }
        
        body {
            font-family: 'B Nazanin', Tahoma, Arial, sans-serif;
            background-color: #e5ddd5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100vw;
            transition: background-color 0.3s;
        }
        
        .chat-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            height: 100%; 
            position: relative; 
        }
        
        @media (min-width: 600px) {
            .chat-container {
                height: 95vh;
                margin-top: 2.5vh;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            }
        }
        
        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 8px 15px;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            font-size: 16px;
            display: none;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #054c44;
            z-index: 10;
            height: 35px;
            flex-shrink: 0;
        }
        
        .title-container {
            display: flex;
            align-items: center;
        }
        
        .typing-indicator {
            display: none;
            font-family: 'B Nazanin', Tahoma, Arial, sans-serif;
            font-size: 14px;
            color: #b2dfdb;
            margin-right: 8px;
            font-weight: normal;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        
        .action-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 51px;
            background-color: #fff;
            z-index: 20;
            display: none; 
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            color: #000;
        }
        
        .header-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .btn-call {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 4px 9px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-call:hover { background-color: #1ebe57; }
        
        .btn-disconnect {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            font-size: 13px;
        }
        
        .connection-panel {
            background-color: #f9f9f9;
            padding: 20px 15px;
            display: flex; /* نمایش مستقیم بدون نیاز به کلیک */
            flex-direction: column;
            gap: 10px;
            border-radius: 10px;
            margin: auto 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            border: 1px solid #eee;
            z-index: 60;
        }
        .connection-panel textarea {
            width: 95%;
            height: 55px;
            padding: 8px;
            font-size: 11px;
            direction: ltr;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: monospace;
            align-self: center;
        }
        .quick-code { font-size: 34px; letter-spacing: 8px; text-align: center; font-family: monospace; color: #075e54; font-weight: bold; direction: ltr; }
        .quick-input { width: 60%; align-self: center; font-size: 26px; letter-spacing: 6px; text-align: center; padding: 6px; border: 1px solid #ccc; border-radius: 6px; direction: ltr; font-family: monospace; }
        .manual-box summary { cursor: pointer; font-size: 12px; color: #666; text-align: center; margin-top: 6px; }
        .manual-box { display: flex; flex-direction: column; gap: 10px; }
        .manual-box[open] { gap: 10px; }
        .reconnect-banner { display: none; position: sticky; top: 0; z-index: 55; background: #fff3cd; color: #856404; text-align: center; font-size: 13px; padding: 6px; border-bottom: 1px solid #ffe08a; }
        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            font-size: 13px;
        }
        .btn:hover { background-color: #075e54; }
        .btn-alt { background-color: #25d366; color: #000; }
        .btn-alt:hover { background-color: #1ebe57; }
        .btn-danger { background-color: #d9534f; color: white; }
        
        .chat-messages {
            flex: 1; 
            padding: 12px 15px;
            overflow-y: auto;
            background-color: #efeae2;
            display: none; 
            flex-direction: column;
            gap: 8px;
            touch-action: pan-y; 
        }
        .message {
            max-width: 80%;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .message.selected {
            background-color: #b3d4fc !important;
            box-shadow: 0 0 0 3px #0056b3;
        }
        
        .message img, .message video {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
        }
        .message video { max-height: 250px; background: #000; }
        .sent { background-color: #dcf8c6; align-self: flex-start; border-top-right-radius: 0; }
        .received { background-color: #ffffff; align-self: flex-end; border-top-left-radius: 0; }
        
        .media-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .download-btn {
            display: block;
            text-align: center;
            background-color: #34b7f1;
            color: white;
            text-decoration: none;
            padding: 5px;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 13px;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
        }

        .message.sticker-msg {
            background-color: transparent;
            box-shadow: none;
            font-size: 45px;
            padding: 0;
            margin: 2px 8px;
        }
        
        .chat-input-area {
            display: none; 
            align-items: center;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ddd;
            position: relative;
            flex-shrink: 0;
        }
        
        .send-btn {
            background-color: #128c7e;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            margin-left: 10px; 
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 4px; 
            flex-shrink: 0;
        }
        
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-family: 'B Nazanin', Tahoma, Arial, sans-serif;
            font-size: 15px;
            outline: none;
            min-width: 0;
        }
        
        .icon-btn {
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 4px; 
            flex-shrink: 0;
        }
        .emoji-btn { background-color: #ffcc00; }
        .attach-btn { background-color: #34b7f1; }
        .video-record-btn { background-color: #e91e63; }
        
        .status { text-align: center; font-size: 13px; color: #d9534f; font-weight: bold; }
        
        .sticker-panel {
            display: none;
            position: absolute;
            bottom: 65px;
            left: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            z-index: 100;
            max-height: 280px;
            width: calc(100% - 44px);
            max-width: 420px;
            overflow-y: auto;
        }
        .sticker-panel span { font-size: 28px; cursor: pointer; text-align: center; user-select: none; }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 15px; border-radius: 10px;
            max-width: 85%; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .modal-content img, .modal-content video {
            max-width: 100%; max-height: 45vh; border-radius: 8px; margin-bottom: 10px; background: #000;
        }
        
        .call-content {
            background: #075e54; 
            color: white; 
            padding: 22px 18px; 
            border-radius: 15px;
            font-family: 'B Titr', Tahoma, Arial, sans-serif;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 250px;
        }

        #in-app-record-video {
            width: 100%;
            max-height: 40vh;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
        }
        .record-timer-text {
            color: #d9534f;
            font-weight: bold;
            font-size: 14px;
            margin: 8px 0;
            display: none;
        }

        .video-call-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000;
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }
        #remote-video {
            width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;
        }
        #local-video {
            position: absolute; top: 20px; right: 20px;
            width: 100px; height: 140px; object-fit: cover;
            border-radius: 10px; border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2010;
            transform: scaleX(-1);
        }
        .video-call-controls {
            position: absolute; bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 20px;
            z-index: 2020;
        }
        .call-action-circle {
            width: 55px; height: 55px; border-radius: 50%;
            border: none; color: white; font-size: 22px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <audio id="remote-audio" autoplay playsinline style="display:none;"></audio>

    <div class="chat-container" id="main-container">
        
        <div class="chat-header" id="chat-header">
            <div class="title-container">
                <span id="chat-title"></span>
                <span id="typing-indicator" class="typing-indicator">در حال تایپ...</span>
            </div>
            
            <div class="header-btns">
                <button class="btn-call" id="call-btn" onclick="startCall(false)" title="تماس صوتی">📞</button>
                <button class="btn-call" id="video-call-btn" onclick="startCall(true)" style="background-color: #0088cc;" title="تماس تصویری">📹</button>
                <button class="btn-disconnect" id="disconnect-btn" onclick="showWipeModal()">پاکسازی</button>
            </div>
        </div>
        
        <div class="action-bar" id="action-bar">
            <span id="selection-count">۱ پیام</span>
            <div class="header-btns">
                <button class="icon-btn" onclick="showDeleteModal()" style="background-color: #d9534f;" title="حذف">🗑</button>
                <button class="icon-btn" onclick="clearSelection()" style="background-color: #6c757d;" title="لغو">❌</button>
            </div>
        </div>
        
        <div id="delete-modal" class="modal-overlay">
            <div class="call-content" style="background-color: #fff; color: #000; border: 2px solid #ddd;">
                <h3 style="color:#d9534f; margin-bottom: 20px;">حذف پیام</h3>
                <div class="btn-group" style="flex-direction:column; gap:10px;">
                    <button class="btn btn-danger" onclick="executeDelete('everyone')">برای هر دو نفر</button>
                    <button class="btn btn-alt" style="background:#f0ad4e; color:#fff;" onclick="executeDelete('me')">فقط برای من</button>
                    <button class="btn" style="background-color: #6c757d;" onclick="hideDeleteModal()">انصراف</button>
                </div>
            </div>
        </div>
        
        <div id="wipe-modal" class="modal-overlay">
            <div class="call-content" style="background-color: #fff; color: #000; border: 2px solid #ddd;">
                <h3 style="color:#d9534f; margin-bottom: 15px; font-size:16px;">پاکسازی و خروج</h3>
                <div class="btn-group" style="flex-direction:column; gap:10px;">
                    <button class="btn btn-danger" onclick="executeWipeChoice('everyone')">برای هر دو نفر و قطع ارتباط</button>
                    <button class="btn btn-alt" style="background:#f0ad4e; color:#fff;" onclick="executeWipeChoice('me')">فقط برای من و قطع ارتباط</button>
                    <button class="btn" style="background-color: #6c757d;" onclick="hideWipeModal()">انصراف</button>
                </div>
            </div>
        </div>

        <div id="preview-modal" class="modal-overlay">
            <div class="modal-content">
                <div id="preview-container"></div>
                <div class="btn-group">
                    <button class="btn" id="confirm-media-btn" onclick="confirmSendMedia()">ارسال</button>
                    <button class="btn btn-danger" onclick="cancelSendMedia()">انصراف</button>
                </div>
            </div>
        </div>

        <div id="in-app-record-modal" class="modal-overlay">
            <div class="modal-content" style="width: 310px;">
                <video id="in-app-record-video" autoplay playsinline muted></video>
                <div id="rec-timer" class="record-timer-text">⏺ ضبط: <span id="rec-sec">0</span> ثانیه</div>
                <div class="btn-group" style="margin-top: 10px;">
                    <button class="btn" onclick="switchRecordCamera()" style="background-color: #34b7f1;" title="چرخش">🔄</button>
                    <button id="start-rec-btn" class="btn btn-danger" onclick="startInAppRecording()">شروع ضبط</button>
                    <button id="stop-rec-btn" class="btn" style="display:none; background-color:#e6b800;" onclick="stopInAppRecording()">توقف</button>
                    <button class="btn" style="background-color: #6c757d;" onclick="closeInAppRecordModal()">بستن</button>
                </div>
            </div>
        </div>

        <div id="call-modal" class="modal-overlay">
            <div class="call-content">
                <h3 id="call-status-text">در حال برقراری تماس...</h3>
                <div class="btn-group" id="call-incoming-btns" style="display:none; margin-top: 20px;">
                    <button class="btn btn-alt" onclick="acceptCall()">پاسخ</button>
                    <button class="btn btn-danger" onclick="rejectCall()">رد</button>
                </div>
                <div class="btn-group" id="call-active-btns" style="display:none; margin-top: 20px;">
                    <button class="btn btn-danger" onclick="endCall()" style="width: 100%;">قطع تماس</button>
                </div>
            </div>
        </div>
        
        <div id="video-call-modal" class="video-call-overlay">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="video-call-controls">
                <button class="call-action-circle" onclick="switchCamera()" style="background-color: #34b7f1;" title="چرخش دوربین">🔄</button>
                <button class="call-action-circle" id="mute-mic-btn" onclick="toggleMute()" style="background-color: #6c757d;" title="میکروفون">🎙️</button>
                <button class="call-action-circle" onclick="endCall()" style="background-color: #d9534f;" title="قطع تماس">🛑</button>
            </div>
        </div>

        <!-- پنل اتصال فعال در بدو ورود -->
        <div class="connection-panel" id="connection-panel">
            <div class="status" id="status-text">در انتظار اتصال...</div>
            
            <div class="quick-code" id="quick-code"></div>
            <div class="btn-group">
                <button class="btn" onclick="hostQuick()">ساخت عدد اتصال</button>
            </div>
            <input id="quick-input" class="quick-input" type="tel" inputmode="numeric" maxlength="6" placeholder="------">
            <div class="btn-group">
                <button class="btn btn-alt" onclick="joinQuick()">اتصال با عدد مخاطب</button>
            </div>

            <details class="manual-box">
                <summary>اتصال دستی با کد (بدون سرور واسط)</summary>
                <textarea id="my-code" placeholder="کد شما اینجا تولید می‌شود" readonly onclick="this.select()"></textarea>
                <button id="copy-btn" class="btn" onclick="copyMyCode()" style="display:none; background-color:#34b7f1; width:95%; align-self:center; font-size:13px;">📋 کپی کردن کد برای ارسال</button>
                <textarea id="peer-code" placeholder="کد مخاطب را اینجا وارد کنید"></textarea>
                <div class="btn-group">
                    <button class="btn" onclick="createOffer()">۱. ایجاد کد</button>
                    <button class="btn btn-alt" onclick="createAnswer()">۲. پاسخ</button>
                    <button class="btn" onclick="addAnswer()">۳. تایید</button>
                </div>
            </details>
        </div>
        
        <div class="reconnect-banner" id="reconnect-banner"></div>
        <div class="chat-messages" id="messages-container"></div>
        
        <div class="sticker-panel" id="sticker-panel">
        </div>
        <div class="chat-input-area" id="input-area">
            <button class="send-btn" id="send-btn" onclick="sendTextMessage()" title="ارسال">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
            <input type="text" id="message-input" placeholder="پیام..." onkeypress="handleEnter(event)">
            <button class="icon-btn emoji-btn" id="emoji-btn" onclick="toggleStickers()" title="استیکر">😀</button>
            
            <button class="icon-btn video-record-btn" id="video-rec-btn" onclick="openInAppRecordModal()" title="فیلم کم‌حجم">🎥</button>
            
            <input type="file" id="media-input" accept="image/*, video/*" style="display: none;">
            <button class="icon-btn attach-btn" id="attach-btn" onclick="document.getElementById('media-input').click()" title="فایل">📎</button>
        </div>
    </div>

    <script>
        const mainContainer = document.getElementById('main-container');
        const msgContainer = document.getElementById('messages-container');

        function adjustHeight() {
            if (window.visualViewport) {
                mainContainer.style.height = window.visualViewport.height + 'px';
                window.scrollTo(0, 0); 
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', adjustHeight);
            window.visualViewport.addEventListener('scroll', adjustHeight);
            adjustHeight();
        }

        let peerConnection;
        let dataChannel;
        let incomingFiles = {}; 
        let pendingMediaBlob = null; 
        let pendingMediaType = null;
        
        let callConnection;
        let localStream;
        let pendingCallOffer = null;
        let isCurrentCallVideo = false;
        let currentFacingMode = "user";
        
        let selectedMessages = [];
        let typingTimer;
        let isTyping = false;

        let recStream = null;
        let internalRecorder = null;
        let recChunks = [];
        let recTimerInterval = null;
        let recSecCount = 0;
        let recFacingMode = "user";

        const rtcConfig = {
            iceServers: [
                { urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302', 'stun:freeturn.net:3478'] },
                // سرور رله (TURN): وقتی مسیر مستقیم بین دو شبکه پیدا نشود، ارتباط از این سرور عبور می‌کند
                { urls: ['turn:freeturn.net:3478?transport=udp', 'turn:freeturn.net:3478?transport=tcp', 'turns:freeturn.net:5349'], username: 'free', credential: 'free' }
            ]
        };

        // --- کد کوتاه: حذف خطوط اضافه SDP + فشرده‌سازی ---
        function slimSdp(sdp) {
            const seen = new Set();
            return sdp.split('\r\n').filter(line => {
                if (!line) return false;
                if (line.startsWith('a=candidate:')) {
                    if (/ tcp /i.test(line)) return false;          // کاندیدهای TCP معمولاً بی‌فایده‌اند
                    if (/\.local /.test(line)) return false;        // آدرس mDNS بین دو شبکه کار نمی‌کند
                    const key = line.split(' ').slice(4, 6).join(':');
                    if (seen.has(key)) return false;                 // حذف تکراری‌ها
                    seen.add(key);
                }
                if (line.startsWith('a=extmap') || line.startsWith('a=msid-semantic')) return false;
                return true;
            }).join('\r\n') + '\r\n';
        }

        function watchConnection(pc) {
            pc.addEventListener('iceconnectionstatechange', () => {
                const st = document.getElementById('status-text');
                if (pc !== peerConnection) return;
                if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                    if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
                }
                if (room && pc.iceConnectionState === 'disconnected') {
                    if (!disconnectTimer) disconnectTimer = setTimeout(() => {
                        disconnectTimer = null;
                        if (pc === peerConnection && pc.iceConnectionState !== 'connected' && pc.iceConnectionState !== 'completed') startReconnect();
                    }, 8000);
                    return;
                }
                if (room && pc.iceConnectionState === 'failed') { startReconnect(); return; }
                if (pc.iceConnectionState === 'checking') { st.textContent = 'در حال برقراری اتصال...'; st.style.color = '#128c7e'; }
                if (pc.iceConnectionState === 'failed') {
                    st.textContent = 'اتصال برقرار نشد. یکی از دو طرف شبکه را عوض کند (وای‌فای/داده همراه) و دوباره «ایجاد کد» بزند.';
                    st.style.color = '#d9534f';
                }
            });
        }

        async function encodeCode(desc) {
            const json = JSON.stringify({ t: desc.type === 'offer' ? 'o' : 'a', s: slimSdp(desc.sdp) });
            try {
                const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                const buf = new Uint8Array(await new Response(stream).arrayBuffer());
                let bin = ''; buf.forEach(b => bin += String.fromCharCode(b));
                return 'Z' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                return btoa(JSON.stringify(desc));
            }
        }

        async function decodeCode(code) {
            code = code.replace(/\s+/g, '');
            if (code[0] !== 'Z') return JSON.parse(atob(code));     // سازگار با کدهای قدیمی
            let b64 = code.slice(1).replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const bin = atob(b64);
            const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            const o = JSON.parse(await new Response(stream).text());
            return { type: o.t === 'o' ? 'offer' : 'answer', sdp: o.s };
        }

        function waitForAllIceCandidates(pc) {
            return new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                } else {
                    const checkState = () => {
                        if (pc.iceGatheringState === 'complete') {
                            pc.removeEventListener('icegatheringstatechange', checkState);
                            resolve();
                        }
                    };
                    pc.addEventListener('icegatheringstatechange', checkState);
                    setTimeout(() => {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }, 7000);
                }
            });
        }

        // ---------- اتصال سریع با عدد ۶ رقمی (سرور واسط: ntfy.sh) ----------
        const SIGNAL_URL = 'https://ntfy.sh/';
        let signalSource = null;
        let signalTimer = null;

        function signalTopic(code) { return 'ourch4-p2p-k7x3-' + code; }

        function closeSignal() {
            if (signalSource) { signalSource.close(); signalSource = null; }
            if (signalTimer) { clearTimeout(signalTimer); signalTimer = null; }
        }

        // پیام‌های سرور واسط رمزنگاری و امضا می‌شوند؛ پیامی که با کلید درست ساخته نشده باشد نادیده گرفته می‌شود
        let signalKey = null;

        function b64(bytes) { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
        function unb64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

        async function deriveKey(secret, purpose) {
            const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: new TextEncoder().encode('ourch4-' + purpose), iterations: 150000, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
        }

        async function sealMsg(key, obj) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
            return { v: b64(iv), e: b64(ct) };
        }

        async function openMsg(key, box) {
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.v) }, key, unb64(box.e));
            return JSON.parse(new TextDecoder().decode(pt));
        }

        async function signalSend(code, obj) {
            if (!signalKey) throw new Error('no key');
            const box = await sealMsg(signalKey, Object.assign({ ts: Date.now() }, obj));
            await fetch(SIGNAL_URL + signalTopic(code), { method: 'POST', body: JSON.stringify(box) });
        }

        function signalListen(code, onMsg) {
            closeSignal();
            const since = Math.floor(Date.now() / 1000) - 5;
            signalSource = new EventSource(SIGNAL_URL + signalTopic(code) + '/sse?since=' + since);
            const key = signalKey;
            signalSource.onmessage = async ev => {
                try {
                    const outer = JSON.parse(ev.data);
                    if (outer.event && outer.event !== 'message') return;
                    const msg = await openMsg(key, JSON.parse(outer.message));   // کلید اشتباه = خطا = نادیده
                    if (!msg.ts || Math.abs(Date.now() - msg.ts) > 2 * 60 * 1000) return; // پیام قدیمی/تکراری
                    onMsg(msg);
                } catch (e) {}
            };
            signalSource.onerror = () => {
                if (signalSource && signalSource.readyState === EventSource.CLOSED) {
                    setStatus('سرور واسط در دسترس نیست. از «اتصال دستی» استفاده کنید.', '#d9534f');
                }
            };
            return new Promise(resolve => { signalSource.onopen = () => resolve(); setTimeout(resolve, 4000); });
        }

        function startSignalTimeout(seconds) {
            signalTimer = setTimeout(() => {
                closeSignal();
                setStatus('مخاطب پیدا نشد. دوباره امتحان کنید.', '#d9534f');
            }, seconds * 1000);
        }

        function setupDataChannel() {
            dataChannel.binaryType = 'arraybuffer';
            
            dataChannel.onopen = () => {
                closeSignal();
                showChatUI();
                onChannelOpen();
            };
            
            dataChannel.onclose = () => startReconnect();
            
            dataChannel.onmessage = event => {
                if (typeof event.data === 'string') {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'text') {
                        addMessageToChat(msg.data, 'received', msg.id);
                    } else if (msg.type === 'sticker') {
                        addStickerToChat(msg.data, 'received', msg.id);
                    } else if (msg.type === 'file-start') {
                        incomingFiles[msg.id] = {
                            mime: msg.mime,
                            chunks: [],
                            receivedBytes: 0,
                            totalBytes: msg.size
                        };
                    } else if (msg.type === 'file-end') {
                        const fileData = incomingFiles[msg.id];
                        if (fileData) {
                            const blob = new Blob(fileData.chunks, { type: fileData.mime });
                            const url = URL.createObjectURL(blob);
                            displayBlobInChat(url, fileData.mime.startsWith('video') ? 'video' : 'img', 'received', msg.id);
                            delete incomingFiles[msg.id];
                        }
                    } else if (msg.type === 'control') {
                        if (msg.command === 'disconnect') {
                            executeSilentWipe();
                        } else if (msg.command === 'room') {
                            if (!room && role === 'answerer') {
                                room = msg.room;
                                roomSecret = msg.secret;
                                saveSession();
                            }
                        } else if (msg.command === 'left') {
                            peerLeft();
                        } else if (msg.command === 'delete-messages') {
                            msg.ids.forEach(id => {
                                const el = document.querySelector(`[data-msg-id="${id}"]`);
                                if (el) el.remove();
                            });
                            unlogMessages(msg.ids);
                        } else if (msg.command === 'typing') {
                            document.getElementById('typing-indicator').style.display = 'block';
                        } else if (msg.command === 'stop-typing') {
                            document.getElementById('typing-indicator').style.display = 'none';
                        }
                    } else if (msg.type === 'call-offer') handleCallOffer(msg.sdp, msg.isVideo);
                    else if (msg.type === 'call-answer') handleCallAnswer(msg.sdp);
                    else if (msg.type === 'call-candidate') handleCallCandidate(msg.candidate);
                    else if (msg.type === 'call-reject') handleCallReject();
                    else if (msg.type === 'call-end') handleCallEnd();
                } else if (event.data instanceof ArrayBuffer) {
                    const view = new DataView(event.data);
                    const idLen = view.getUint8(0);
                    const idBytes = new Uint8Array(event.data, 1, idLen);
                    const id = new TextDecoder().decode(idBytes);
                    const chunk = event.data.slice(1 + idLen);

                    if (incomingFiles[id]) {
                        incomingFiles[id].chunks.push(chunk);
                    }
                }
            };
        }

            recStream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 20 }, facingMode: facing },

        function startInAppRecording() {
            recChunks = [];

            let chosenMime = 'video/webm;codecs=vp8,opus';
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                chosenMime = 'video/mp4';
            } else if (!MediaRecorder.isTypeSupported(chosenMime)) {
                chosenMime = '';
            }

            const recOptions = chosenMime ? {
                mimeType: chosenMime,
                videoBitsPerSecond: 450000
            } : { videoBitsPerSecond: 450000 };

            try {
                internalRecorder = new MediaRecorder(recStream, recOptions);
            } catch(e) {
                internalRecorder = new MediaRecorder(recStream);
            }

            internalRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) recChunks.push(e.data);
            };

            internalRecorder.onstop = () => {
                const recordedType = internalRecorder.mimeType || 'video/mp4';
                pendingMediaBlob = new Blob(recChunks, { type: recordedType });
                pendingMediaType = 'video';
                
                closeInAppRecordModal();

                const previewContainer = document.getElementById('preview-container');
                previewContainer.innerHTML = '';
                const v = document.createElement('video');
                v.controls = true;
                v.playsInline = true;
                v.src = URL.createObjectURL(pendingMediaBlob);
                previewContainer.appendChild(v);
                
                document.getElementById('confirm-media-btn').textContent = 'ارسال';
                document.getElementById('confirm-media-btn').disabled = false;
                document.getElementById('preview-modal').style.display = 'flex';
            };

            internalRecorder.start(500);
            recSecCount = 0;
            document.getElementById('rec-sec').textContent = recSecCount;
            document.getElementById('rec-timer').style.display = 'block';
            document.getElementById('start-rec-btn').style.display = 'none';
            document.getElementById('stop-rec-btn').style.display = 'inline-block';

            recTimerInterval = setInterval(() => {
                recSecCount++;
                document.getElementById('rec-sec').textContent = recSecCount;
            }, 1000);
        }

        function stopInAppRecording() {
            if (internalRecorder && internalRecorder.state === 'recording') {
                internalRecorder.stop();
            }
            clearInterval(recTimerInterval);
        }

        document.getElementById('media-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            pendingMediaBlob = file;
            pendingMediaType = file.type.startsWith('video') ? 'video' : 'img';
            
            const previewContainer = document.getElementById('preview-container');
            previewContainer.innerHTML = '';
            let el = (pendingMediaType === 'video') ? document.createElement('video') : document.createElement('img');
            if (pendingMediaType === 'video') {
                el.controls = true;
                el.playsInline = true;
            }
            el.src = URL.createObjectURL(pendingMediaBlob);
            previewContainer.appendChild(el);
            document.getElementById('confirm-media-btn').textContent = 'ارسال';
            document.getElementById('confirm-media-btn').disabled = false;
            document.getElementById('preview-modal').style.display = 'flex';
        });

        function cancelSendMedia() {
            document.getElementById('preview-modal').style.display = 'none';
            pendingMediaBlob = null;
            pendingMediaType = null;
            document.getElementById('media-input').value = '';
        }

        async function confirmSendMedia() {
            if (!pendingMediaBlob || !dataChannel || dataChannel.readyState !== 'open') return;
            
            const sendBtn = document.getElementById('confirm-media-btn');
            sendBtn.textContent = 'در حال ارسال...';
            sendBtn.disabled = true;

            const msgId = generateUniqueId();
            const blobUrl = URL.createObjectURL(pendingMediaBlob);
            displayBlobInChat(blobUrl, pendingMediaType, 'sent', msgId);
            
            const arrayBuffer = await pendingMediaBlob.arrayBuffer();
            const mimeType = pendingMediaBlob.type || 'video/mp4';

            dataChannel.send(JSON.stringify({ 
                type: 'file-start', 
                id: msgId, 
                mime: mimeType, 
                size: arrayBuffer.byteLength 
            }));

            const CHUNK_SIZE = 16384; 
            const idBytes = new TextEncoder().encode(msgId);
            const idLen = idBytes.length;

            let offset = 0;
            function sendChunks() {
                while (offset < arrayBuffer.byteLength) {
                    if (dataChannel.bufferedAmount > 256 * 1024) {
                        setTimeout(sendChunks, 25);
                        return;
                    }
                    const end = Math.min(offset + CHUNK_SIZE, arrayBuffer.byteLength);
                    const chunkData = arrayBuffer.slice(offset, end);
                    
                    const packet = new Uint8Array(1 + idLen + chunkData.byteLength);
                    packet[0] = idLen;
                    packet.set(idBytes, 1);
                    packet.set(new Uint8Array(chunkData), 1 + idLen);

                    dataChannel.send(packet.buffer);
                    offset = end;
                }

                dataChannel.send(JSON.stringify({ type: 'file-end', id: msgId }));
                cancelSendMedia();
            }

            sendChunks();
        }

        function showWipeModal() {
            document.getElementById('wipe-modal').style.display = 'flex';
        }

        function hideWipeModal() {
            document.getElementById('wipe-modal').style.display = 'none';
        }

        function executeWipeChoice(mode) {
            hideWipeModal();
            if (mode === 'everyone') {
                if (dataChannel && dataChannel.readyState === 'open') {
                    try {
                        dataChannel.send(JSON.stringify({ type: 'control', command: 'disconnect' }));
                    } catch(e) {}
                }
                setTimeout(() => {
                    executeSilentWipe();
                }, 100);
            } else if (mode === 'me') {
                if (dataChannel && dataChannel.readyState === 'open') {
                    try { dataChannel.send(JSON.stringify({ type: 'control', command: 'left' })); } catch(e) {}
                }
                setTimeout(() => { executeSilentWipe(); }, 100);
            }
        }

        function executeSilentWipe() {
            stopReconnect();
            room = null; roomSecret = null; signalKey = null;
            try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
            cleanupCall();
            closeInAppRecordModal();
            if (dataChannel) {
                dataChannel.onclose = null;
                dataChannel.close();
            }
            if (peerConnection) {
                peerConnection.close();
            }
            document.body.innerHTML = '';
            document.body.style.backgroundColor = '#ffffff';
        }

        async function startCall(videoCall = false) {
            isCurrentCallVideo = videoCall;
            try {
                const constraints = {
                    audio: true,
                    video: videoCall ? { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (videoCall) {
                    document.getElementById('local-video').srcObject = localStream;
                    document.getElementById('video-call-modal').style.display = 'flex';
                } else {
                    showCallModal("در حال تماس صوتی...", "active");
                }

                callConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => callConnection.addTrack(track, localStream));

                callConnection.onicecandidate = e => {
                    if (e.candidate && dataChannel && dataChannel.readyState === 'open') {
                        dataChannel.send(JSON.stringify({ type: 'call-candidate', candidate: e.candidate }));
                    }
                };

                callConnection.ontrack = e => {
                    if (isCurrentCallVideo) {
                        document.getElementById('remote-video').srcObject = e.streams[0];
                    } else {
                        document.getElementById('remote-audio').srcObject = e.streams[0];
                    }
                };

                const offer = await callConnection.createOffer();
                await callConnection.setLocalDescription(offer);
                dataChannel.send(JSON.stringify({ type: 'call-offer', sdp: offer, isVideo: videoCall }));
            } catch (err) {
                alert("خطا در دسترسی به دوربین یا میکروفون: " + err.message);
                cleanupCall();
                hideCallModal();
            }
        }

        function handleCallOffer(offer, isVideo) {
            pendingCallOffer = offer;
            isCurrentCallVideo = isVideo;
            showCallModal(isVideo ? "تماس تصویری ورودی..." : "تماس صوتی ورودی...", "incoming");
        }

        async function acceptCall() {
            try {
                const constraints = {
                    audio: true,
                    video: isCurrentCallVideo ? { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                hideCallModal();

                if (isCurrentCallVideo) {
                    document.getElementById('local-video').srcObject = localStream;
                    document.getElementById('video-call-modal').style.display = 'flex';
                } else {
                    showCallModal("در حال مکالمه", "active");
                }

                callConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => callConnection.addTrack(track, localStream));

                callConnection.onicecandidate = e => {
                    if (e.candidate && dataChannel && dataChannel.readyState === 'open') {
                        dataChannel.send(JSON.stringify({ type: 'call-candidate', candidate: e.candidate }));
                    }
                };

                callConnection.ontrack = e => {
                    if (isCurrentCallVideo) {
                        document.getElementById('remote-video').srcObject = e.streams[0];
                    } else {
                        document.getElementById('remote-audio').srcObject = e.streams[0];
                    }
                };

                await callConnection.setRemoteDescription(new RTCSessionDescription(pendingCallOffer));
                const answer = await callConnection.createAnswer();
                await callConnection.setLocalDescription(answer);

                dataChannel.send(JSON.stringify({ type: 'call-answer', sdp: answer }));
                pendingCallOffer = null;
            } catch (err) {
                alert("خطا در دسترسی به دوربین/میکروفون.");
                rejectCall();
            }
        }

        function rejectCall() {
            if (dataChannel && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify({ type: 'call-reject' }));
            hideCallModal();
            pendingCallOffer = null;
        }

        function handleCallReject() {
            alert("تماس رد شد.");
            cleanupCall();
            hideCallModal();
        }

        async function handleCallAnswer(answer) {
            if (callConnection) {
                await callConnection.setRemoteDescription(new RTCSessionDescription(answer));
                if (!isCurrentCallVideo) {
                    showCallModal("در حال مکالمه", "active");
                }
            }
        }

        function handleCallCandidate(candidate) {
            if (callConnection) callConnection.addIceCandidate(new RTCIceCandidate(candidate));
        }

        function endCall() {
            if (dataChannel && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify({ type: 'call-end' }));
            cleanupCall();
            hideCallModal();
        }

        function handleCallEnd() {
            cleanupCall();
            hideCallModal();
        }

        function cleanupCall() {
            if (callConnection) { callConnection.close(); callConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            document.getElementById('remote-audio').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('local-video').srcObject = null;
            document.getElementById('video-call-modal').style.display = 'none';
        }

        async function switchCamera() {
            if (!localStream || !isCurrentCallVideo) return;
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) videoTrack.stop();

            try {
                const newStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }
                });
                const newVideoTrack = newStream.getVideoTracks()[0];
                localStream.removeTrack(videoTrack);
                localStream.addTrack(newVideoTrack);

                const sender = callConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(newVideoTrack);

                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('local-video').style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "none";
            } catch (e) {
                console.error("خطا در جابجایی دوربین", e);
            }
        }

        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('mute-mic-btn').style.backgroundColor = audioTrack.enabled ? "#6c757d" : "#d9534f";
                document.getElementById('mute-mic-btn').textContent = audioTrack.enabled ? "🎙" : "🔇";
            }
        }

        function showCallModal(text, state) {
            document.getElementById('call-modal').style.display = 'flex';
            document.getElementById('call-status-text').textContent = text;
            if (state === 'incoming') {
                document.getElementById('call-incoming-btns').style.display = 'flex';
                document.getElementById('call-active-btns').style.display = 'none';
            } else if (state === 'active') {
                document.getElementById('call-incoming-btns').style.display = 'none';
                document.getElementById('call-active-btns').style.display = 'flex';
            }
        }

        function hideCallModal() { document.getElementById('call-modal').style.display = 'none'; }

        // ---------- اتصال مجدد خودکار و نگه‌داشتن پیام‌ها ----------
        const SESSION_KEY = 'ourch4-session';
        let room = null;          // شناسه مخفی اتاق برای اتصال مجدد
        let roomSecret = null;    // کلید مشترک دو نفر؛ فقط از داخل کانال رمزشده رد و بدل می‌شود
        let firstOpenDone = false;
        let role = null;          // offerer یا answerer
        let chatLog = [];         // پیام‌های متنی و استیکر (فقط در همین تب)
        let restoring = false;
        let reconnecting = false;
        let reconnectLoop = null;
        let reconnectDeadline = 0;
        let disconnectTimer = null;

        function showChatUI() {
            document.getElementById('connection-panel').style.display = 'none';
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('messages-container').style.display = 'flex';
            document.getElementById('input-area').style.display = 'flex';
            document.body.style.backgroundColor = '#e5ddd5';
            adjustHeight();
        }

        function setBanner(text, color) {
            const b = document.getElementById('reconnect-banner');
            if (!b) return;
            if (!text) { b.style.display = 'none'; return; }
            b.textContent = text; b.style.display = 'block';
            b.style.background = color || '#fff3cd';
        }

        function saveSession() {
            try {
                if (!room) return;
                sessionStorage.setItem(SESSION_KEY, JSON.stringify({ room, roomSecret, role, chatLog }));
            } catch (e) {}
        }

        function logMessage(kind, data, dir, id) {
            if (restoring || !id) return;
            chatLog.push({ kind, data, dir, id });
            saveSession();
        }

        function unlogMessages(ids) {
            chatLog = chatLog.filter(m => !ids.includes(m.id));
            saveSession();
        }

        function onChannelOpen() {
            stopReconnect();
            setBanner('');
            const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
            if (!room && role === 'offerer') {
                room = hex(12);
                roomSecret = hex(32);
                try { dataChannel.send(JSON.stringify({ type: 'control', command: 'room', room, secret: roomSecret })); } catch (e) {}
            }
            saveSession();
            if (!firstOpenDone) { firstOpenDone = true; showSafetyCode(); }
        }

        function roomCode() { return 'room-' + room; }

        // کد امنیتی: از اثر انگشت رمزنگاری هر دو طرف ساخته می‌شود. اگر روی هر دو گوشی یکی باشد، نفر سومی وسط نیست.
        async function showSafetyCode() {
            try {
                const fp = sdp => ((sdp || '').match(/a=fingerprint:\S+ (\S+)/) || [])[1] || '';
                const parts = [fp(peerConnection.localDescription.sdp), fp(peerConnection.remoteDescription.sdp)].sort();
                const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.join('|'))));
                const num = ((h[0] << 16) | (h[1] << 8) | h[2]) % 1000000;
                const s = String(num).padStart(6, '0');
                const faDigits = s.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
                setBanner('کد امنیتی: ' + faDigits.slice(0, 3) + ' ' + faDigits.slice(3) + ' — با مخاطب (تلفنی یا حضوری) مقایسه کنید. اگر یکی نبود، گفتگو را پاکسازی کنید. (برای بستن لمس کنید)', '#d4edda');
                const b = document.getElementById('reconnect-banner');
                b.onclick = () => { b.onclick = null; setBanner(''); };
            } catch (e) {}
        }

        function stopReconnect() {
            reconnecting = false;
            if (reconnectLoop) { clearTimeout(reconnectLoop); reconnectLoop = null; }
            if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
            closeSignal();
        }

        function peerLeft() {
            stopReconnect();
            room = null;
            try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
            if (dataChannel) { dataChannel.onclose = null; try { dataChannel.close(); } catch(e) {} }
            if (peerConnection) peerConnection.close();
            cleanupCall();
            setBanner('مخاطب از گفتگو خارج شد.', '#f8d7da');
        }

        async function startReconnect() {
            if (reconnecting) return;
            if (dataChannel && dataChannel.readyState === 'open') return;
            if (!room) {
                setBanner('ارتباط قطع شد.', '#f8d7da');
                return;
            }
            reconnecting = true;
            try { cleanupCall(); } catch (e) {}
            reconnectDeadline = Date.now() + 10 * 60 * 1000;
            setBanner('ارتباط قطع شد؛ در حال اتصال مجدد...');
            if (!roomSecret) { reconnecting = false; setBanner('ارتباط قطع شد.', '#f8d7da'); return; }
            signalKey = await deriveKey(roomSecret, 'room');

            if (role === 'answerer') {
                let busy = false;
                await signalListen(roomCode(), async msg => {
                    if (msg.k !== 'offer' || busy) return;
                    busy = true;
                    try {
                        const answerCode = await buildAnswer(msg.c);
                        await signalSend(roomCode(), { k: 'answer', to: msg.from, c: answerCode });
                    } catch (e) {}
                    busy = false;
                });
                reconnectLoop = setTimeout(reconnectGiveUp, 10 * 60 * 1000);
            } else {
                let me = '';
                await signalListen(roomCode(), async msg => {
                    if (msg.k !== 'answer' || msg.to !== me) return;
                    try { await applyAnswer(msg.c); } catch (e) {}
                });
                const attempt = async () => {
                    if (!reconnecting) return;
                    if (dataChannel && dataChannel.readyState === 'open') return;
                    if (Date.now() > reconnectDeadline) return reconnectGiveUp();
                    try {
                        me = Math.random().toString(36).slice(2, 10);
                        const offerCode = await buildOffer();
                        await signalSend(roomCode(), { k: 'offer', from: me, c: offerCode });
                    } catch (e) {}
                    reconnectLoop = setTimeout(attempt, 15000);
                };
                attempt();
            }
        }

        function reconnectGiveUp() {
            stopReconnect();
            setBanner('اتصال مجدد ممکن نشد. صفحه را باز نگه دارید و دوباره تلاش کنید.', '#f8d7da');
            const b = document.getElementById('reconnect-banner');
            b.onclick = () => { b.onclick = null; startReconnect(); };
        }

        function restoreSession() {
            let s = null;
            try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
            if (!s || !s.room) return;
            room = s.room; roomSecret = s.roomSecret; role = s.role; chatLog = s.chatLog || [];
            firstOpenDone = true;
            showChatUI();
            restoring = true;
            chatLog.forEach(m => {
                if (m.kind === 'text') addMessageToChat(m.data, m.dir, m.id);
                else addStickerToChat(m.data, m.dir, m.id);
            });
            restoring = false;
            startReconnect();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && room && !reconnecting &&
                (!dataChannel || dataChannel.readyState !== 'open')) {
                startReconnect();
            }
        });

        restoreSession();
    </script>
</body>
